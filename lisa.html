<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisa 3D (essai)</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  /* Ombre au sol : ellipse douce qui respire avec le vol stationnaire */
  .shadow {
    position: absolute;
    left: 50%;
    bottom: 1%;
    width: 30%;
    height: 9%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
      rgba(0,0,0,0.40) 0%,
      rgba(0,0,0,0.22) 35%,
      rgba(0,0,0,0.00) 70%);
    animation: none;
    pointer-events: none;
  }
  model-viewer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    --progress-bar-color: transparent;
    animation: none;
    cursor: grab;
  }
  model-viewer:active { cursor: grabbing; }
  @keyframes hover-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3.5%); }
  }
  @keyframes shadow-breathe {
    0%, 100% { transform: translateX(-50%) scale(1);    opacity: 1; }
    50%      { transform: translateX(-50%) scale(0.82); opacity: 0.7; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="shadow"></div>
    <model-viewer
      id="robot"
      src="lisa.glb"
      alt="Lisa"
      auto-rotate
      auto-rotate-delay="0"
      rotation-per-second="22deg"
      camera-controls
      disable-zoom
      disable-pan
      interaction-prompt="none"
      camera-orbit="-20deg 85deg 105%"
      min-camera-orbit="auto 55deg auto"
      max-camera-orbit="auto 105deg auto"
      camera-target="auto auto auto"
      environment-image="neutral"
      exposure="1.05"
      shadow-intensity="0"
      loading="eager"
      reveal="auto">
    </model-viewer>
  </div>
  <script>
    // Réglages via l'URL : ?speed=30&float=0&shadow=0
    const p = new URLSearchParams(location.search);
    const mv = document.getElementById('robot');
    if (p.has('speed')) mv.setAttribute('rotation-per-second', p.get('speed') + 'deg');
    if (p.get('float') === '0') mv.style.animation = 'none';
    if (p.get('shadow') === '0') document.querySelector('.shadow').style.display = 'none';
    if (p.get('rotate') === '0') mv.removeAttribute('auto-rotate');
  </script>
</body>
</html>
