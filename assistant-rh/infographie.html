<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte du droit social</title>
<link rel="stylesheet" href="commun.css">
<style>
#scene{background:radial-gradient(circle at 34% 54%,#fff 0,#F7F8FC 40%,#E9EEF9 100%)}
.titre{position:absolute;left:36px;top:26px}
.titre h1{margin:8px 0 0;font:800 30px/1.1 var(--f-display);color:var(--navy)}
.compteur{position:absolute;right:30px;top:30px;background:var(--navy);color:#fff;font:700 14px/1 var(--f-display);padding:10px 16px;border-radius:999px}
.compteur b{color:var(--lime)}
/* carte */
#carte{position:absolute;left:0;top:0;width:820px;height:675px}
#carte svg{position:absolute;inset:0}
.centre{position:absolute;left:300px;top:244px;width:200px;height:200px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;padding:18px;box-shadow:0 18px 40px rgba(11,42,102,.35);border:0}
.centre strong{display:block;font:800 22px/1.1 var(--f-display)}
.centre small{display:block;margin-top:6px;font-size:13px;color:#C9D4EF;line-height:1.3}
.centre .plus,.noeud .plus{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--navy);font:800 20px/30px var(--f-display);text-align:center}
.noeud{position:absolute;width:170px;min-height:92px;border-radius:20px;background:#fff;border:3px solid var(--c);color:var(--navy);text-align:left;padding:14px 16px 14px;box-shadow:0 10px 24px rgba(11,42,102,.12);transition:transform .18s,box-shadow .18s}
.noeud:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(11,42,102,.2)}
.noeud .ico{font-size:24px;line-height:1}
.noeud strong{display:block;margin-top:6px;font:700 15.5px/1.2 var(--f-display)}
.noeud.vu{background:var(--c);color:#fff}
.noeud.vu .plus{background:#fff}
.noeud.actif{outline:4px solid var(--lime);outline-offset:3px}
/* panneau */
#panneau{position:absolute;right:0;top:0;width:420px;height:675px;background:#fff;box-shadow:-18px 0 40px rgba(11,42,102,.16);padding:84px 30px 24px;overflow:auto;transform:translateX(100%);transition:transform .4s cubic-bezier(.25,.46,.45,.94)}
#panneau.ouvert{transform:none}
#panneau .bandeau{position:absolute;left:0;right:0;top:0;height:8px;background:var(--c)}
#panneau h2{margin:0 0 10px;font:800 24px/1.15 var(--f-display);color:var(--navy)}
#panneau p{margin:0 0 12px;font-size:15.5px}
#panneau ul{margin:0 0 12px;padding-left:18px;font-size:15px}
#panneau li{margin-bottom:5px}
#panneau .xyz{background:var(--soft);border-left:5px solid var(--lime);border-radius:10px;padding:12px 14px;font-size:14.5px;margin-top:6px}
#panneau .xyz b{color:var(--navy)}
#fermer{position:absolute;right:18px;top:20px;width:38px;height:38px;border-radius:50%;border:2px solid var(--navy);background:#fff;color:var(--navy);font:800 18px/1 var(--f-display)}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 12px}
.parties div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.25}
.parties b{display:block;font:800 12px/1 var(--f-display);color:var(--blue);margin-bottom:3px}
/* pyramide */
.pyr{display:grid;gap:5px;margin:6px 0 12px;justify-items:center}
.pyr button{border:0;border-radius:8px;color:#fff;font:700 13px/1.15 var(--f-display);padding:9px 8px;text-align:center;transition:filter .15s}
.pyr button:hover{filter:brightness(1.12)}
.pyr button.sel{outline:3px solid var(--lime);outline-offset:2px}
#detailPyr{min-height:64px;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.colonnes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colonnes h3{margin:0 0 6px;font:800 14px/1.1 var(--f-display);color:var(--navy)}
.colonnes ul{padding-left:16px!important;font-size:13.5px!important}
/* Clara qui guide */
#guide{position:absolute;left:24px;bottom:18px;display:flex;align-items:flex-end;gap:10px;max-width:520px}
#guide .tete{width:86px;height:86px;border-radius:50%;background:#fff url(img/clara-tete.webp) center 18%/130% auto no-repeat;border:4px solid var(--lime);flex:none}
#guide .mot{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:15px;color:var(--navy);box-shadow:0 8px 20px rgba(11,42,102,.15)}
</style>
</head>
<body>
<div id="scene">
  <div class="titre"><span class="eyebrow">Module 1 · Les bases du droit social</span><h1>La carte du droit social</h1></div>
  <div class="compteur"><b id="nbVu">0</b> / 6 branches explorées</div>
  <div id="carte">
    <svg width="820" height="675" aria-hidden="true" id="liens"></svg>
    <button class="centre" type="button" data-k="centre"><span><strong>Le droit social</strong><small>droit du travail<br>+ protection sociale</small></span><span class="plus">+</span></button>
  </div>
  <aside id="panneau" aria-live="polite"><div class="bandeau"></div><button id="fermer" type="button" aria-label="Fermer">✕</button><div id="contenu"></div></aside>
  <div id="guide"><div class="tete" aria-hidden="true"></div><div class="mot" id="mot">On commence par le centre ? Clique sur chaque branche avec le bouton <b>+</b>, je te suis.</div></div>
</div>
<script src="commun.js"></script>
<script>
const BR = [
 {k:'code', ico:'📘', titre:'Le Code du travail', c:'#0050FF', x:110, y:108,
  html:`<p>Le texte de base du droit du travail : il fixe le <span class="hl">socle minimal</span> des règles (contrats, salaires, durée du travail, santé et sécurité…).</p>
  <p>Il est organisé en <b>8 parties</b> :</p>
  <div class="parties">
   <div><b>1</b>Relations individuelles de travail</div><div><b>2</b>Relations collectives</div>
   <div><b>3</b>Durée du travail, salaire</div><div><b>4</b>Santé et sécurité</div>
   <div><b>5</b>Emploi</div><div><b>6</b>Formation professionnelle</div>
   <div><b>7</b>Professions particulières</div><div><b>8</b>Contrôle de la législation</div></div>
  <div class="xyz"><b>Chez XYZ :</b> la durée légale de 35 heures et le repos de 11 heures entre deux journées, c'est dans le Code du travail.</div>`},
 {k:'sources', ico:'🏛️', titre:'Les sources du droit', c:'#6C3AFB', x:330, y:92,
  html:`<p>Les règles viennent de plusieurs niveaux, <span class="hl">hiérarchisés</span>. Clique sur un étage :</p>
  <div class="pyr" id="pyr"></div><div id="detailPyr">Le haut de la pyramide s'impose à tout ce qui est en dessous.</div>
  <p style="margin-top:10px;font-size:14px">À côté, la <b>jurisprudence</b> (prud'hommes, Cour de cassation) interprète les textes et les applique aux situations réelles.</p>
  <div class="xyz"><b>Chez XYZ :</b> une règle de la convention collective de la branche s'ajoute au Code du travail et le complète pour le secteur.</div>`},
 {k:'acteurs', ico:'🤝', titre:'Les acteurs', c:'#FF5E36', x:560, y:108,
  html:`<ul><li><b>Employeurs et salariés</b> : des obligations mutuelles fixées par le Code et les conventions.</li>
  <li><b>Les syndicats</b> : ils négocient les conventions et accords, et défendent les salariés.</li>
  <li><b>Le CSE</b> (comité social et économique) : obligatoire <span class="hl">dès 11 salariés</span>. Depuis 2017, il remplace les délégués du personnel, le comité d'entreprise et le CHSCT.</li>
  <li><b>Les délégués syndicaux</b> : ils représentent leur syndicat et négocient dans l'entreprise.</li></ul>
  <div class="xyz"><b>Chez XYZ :</b> 150 salariés, donc un CSE à élire. C'est notre mission.</div>`},
 {k:'contrats', ico:'📝', titre:'Les contrats de travail', c:'#128A4A', x:590, y:430,
  html:`<ul><li><b>CDI</b> : la forme normale du contrat, sans date de fin. Période d'essai de 2 à 4 mois selon la catégorie. Fin possible par licenciement, démission ou rupture conventionnelle.</li>
  <li><b>CDD</b> : pour une tâche précise et temporaire (remplacement, surcroît d'activité, saisonnier). 18 mois maximum en règle générale, indemnité de précarité de 10 % à la fin.</li>
  <li><b>Intérim</b> : le salarié est embauché par une agence de travail temporaire et mis à disposition d'une entreprise utilisatrice.</li></ul>
  <div class="xyz"><b>Chez XYZ :</b> pour remplacer Sofia pendant son congé maternité, on parlera de CDD de remplacement.</div>`},
 {k:'obligations', ico:'⚖️', titre:'Obligations de l\'employeur et du salarié', c:'#0B2A66', x:330, y:468,
  html:`<div class="colonnes"><div><h3>L'employeur doit…</h3><ul><li>déclarer l'embauche à l'URSSAF (DPAE) avant la prise de poste</li><li>remettre un contrat et un bulletin de paie</li><li>respecter le SMIC et l'égalité de salaire</li><li>respecter 35 h, 11 h de repos par jour, 24 h par semaine</li><li>évaluer les risques (document unique), fournir les équipements de protection</li><li>former et accorder les congés</li></ul></div>
  <div><h3>Le salarié…</h3><ul><li><b>a droit</b> au respect de sa dignité, à la non-discrimination, à un salaire équitable, à la sécurité, à la formation (CPF) et à la protection de ses données</li><li><b>doit</b> être loyal, faire son travail lui-même, respecter les consignes et le règlement intérieur (obligatoire dès 50 salariés)</li></ul></div></div>
  <div class="xyz"><b>Chez XYZ :</b> si l'atelier A manque de lunettes de protection, l'employeur est en faute ; si Paul refuse de les porter, lui aussi.</div>`},
 {k:'protection', ico:'🛡️', titre:'La protection sociale', c:'#5E7700', x:80, y:430,
  html:`<ul><li><b>La Sécurité sociale</b> : maladie, vieillesse (retraite), famille, accidents du travail et maladies professionnelles.</li>
  <li><b>L'assurance chômage</b> : un revenu de remplacement pour les salariés privés d'emploi, versé par France Travail.</li>
  <li><b>Les régimes complémentaires</b> : notamment les retraites complémentaires obligatoires.</li></ul>
  <div class="xyz"><b>Chez XYZ :</b> les cotisations qui financent tout cela apparaissent sur chaque bulletin de paie.</div>`}
];
const CENTRE = {titre:'Le droit social', c:'#0B2A66', html:`<p>L'ensemble des règles qui encadrent les relations entre <b>employeurs et salariés</b>, plus les règles de la <b>protection sociale</b>.</p>
 <p>Il évolue sans cesse : réformes, conventions collectives, décisions des juges. Pour un ou une assistante RH, c'est la base pour gérer le personnel de façon conforme.</p>
 <div class="xyz"><b>Pour nous :</b> chaque branche de la carte répond à une question qu'on se posera chez XYZ.</div>`};
const PYR = [
 ['La Constitution','Le préambule de 1946 garantit le droit au travail, la liberté syndicale et le droit de grève.',150],
 ['Normes internationales et européennes','Conventions de l\'OIT, directives et règlements de l\'Union européenne.',200],
 ['Lois et ordonnances','Votées par le Parlement ; les ordonnances de 2017 ont réformé le Code du travail.',250],
 ['Règlements : décrets, arrêtés','Pris par le gouvernement, ils précisent comment appliquer les lois.',300],
 ['Conventions et accords collectifs','Négociés entre employeurs et syndicats, au niveau de la branche ou de l\'entreprise.',320],
 ['Usages et règlement intérieur','Pratiques répétées et règles de discipline, d\'hygiène et de sécurité de l\'entreprise.',340],
 ['Le contrat de travail','Ce que l\'employeur et le salarié ont convenu ensemble.',360]];
const COUL = ['#0B2A66','#16367A','#1F4590','#2C55A8','#0050FF','#4B7BFF','#6C3AFB'];

const carte=document.getElementById('carte'), svg=document.getElementById('liens');
const vus=new Set();
BR.forEach(b=>{
  const n=document.createElement('button'); n.type='button'; n.className='noeud'; n.dataset.k=b.k; n.style.setProperty('--c',b.c);
  n.style.left=b.x+'px'; n.style.top=b.y+'px';
  n.innerHTML=`<span class="ico" aria-hidden="true">${b.ico}</span><strong>${b.titre}</strong><span class="plus" aria-hidden="true">+</span>`;
  carte.appendChild(n);
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',400); l.setAttribute('y1',344); l.setAttribute('x2',b.x+85); l.setAttribute('y2',b.y+46);
  l.setAttribute('stroke',b.c); l.setAttribute('stroke-width',4); l.setAttribute('stroke-dasharray','2 9'); l.setAttribute('stroke-linecap','round');
  svg.appendChild(l);
});
const MOTS = {
 code:"Le Code, c'est le minimum garanti. Huit parties, on retiendra surtout les deux premières pour l'instant.",
 sources:"La pyramide, je la garde en tête : plus on monte, plus la règle pèse lourd.",
 acteurs:"Le CSE dès 11 salariés… donc chez XYZ, pas de doute.",
 contrats:"CDI par défaut, CDD pour un besoin temporaire. Noté !",
 obligations:"Des obligations des deux côtés. C'est ça l'équilibre de la relation de travail.",
 protection:"Tout ça se retrouve sur le bulletin de paie, c'est fou.",
 fin:"On a fait le tour des six branches ! On est prêts pour la suite."
};
function ouvre(k){
  const b = k==='centre'?CENTRE:BR.find(x=>x.k===k);
  const p=document.getElementById('panneau'); p.style.setProperty('--c',b.c);
  document.getElementById('contenu').innerHTML=`<h2>${b.titre}</h2>${b.html}`;
  p.classList.add('ouvert');
  document.querySelectorAll('.noeud').forEach(n=>n.classList.toggle('actif',n.dataset.k===k));
  if(k!=='centre'){ vus.add(k); document.querySelector(`.noeud[data-k="${k}"]`).classList.add('vu'); }
  document.getElementById('nbVu').textContent=vus.size;
  document.getElementById('mot').textContent = vus.size===6 ? MOTS.fin : (MOTS[k]||"C'est parti, clique sur une branche.");
  if(k==='sources') pyramide();
}
function pyramide(){
  const z=document.getElementById('pyr');
  PYR.forEach((e,j)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=e[0]; b.style.width=e[2]+'px'; b.style.background=COUL[j];
    b.onclick=()=>{ z.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
      document.getElementById('detailPyr').innerHTML=`<b>${e[0]}</b> : ${e[1]}`; }; z.appendChild(b); });
}
carte.addEventListener('click',e=>{ const n=e.target.closest('[data-k]'); if(n) ouvre(n.dataset.k); });
document.getElementById('fermer').onclick=()=>{ document.getElementById('panneau').classList.remove('ouvert'); document.querySelectorAll('.noeud').forEach(n=>n.classList.remove('actif')); };
</script>
</body>
</html>
