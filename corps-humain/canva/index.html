<!doctype html>
<html lang="fr">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyage au cœur du tronc humain</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #13315c;
      --teal: #1b998b;
      --red: #e63946;
      --ink: #18304f;
      --paper: #f5f8fb;
      --line: #bad0df;
      --skin: #f4cfbb;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-width: 100%; overflow: hidden; }
    body { font-family: "Open Sans", sans-serif; color: var(--ink); }

    .app-shell {
      width: min(100%, calc(177.777 * min(var(--vh, 1vh), 1vh)));
      height: min(calc(100 * min(var(--vh, 1vh), 1vh)), calc(56.25vw));
      min-height: 360px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 15%, rgba(27,153,139,.13), transparent 26%),
        radial-gradient(circle at 93% 88%, rgba(19,49,92,.12), transparent 32%),
        #f5f8fb;
      display: grid;
      grid-template-rows: 15% 1fr 8%;
      box-shadow: 0 0 0 1px rgba(19,49,92,.08);
    }

    .heading-font { font-family: "Montserrat", sans-serif; }
    .screen-reader { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 55% 45%;
      gap: 1.4%;
      padding: 1.2% 2.3%;
    }

    .anatomy-area {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .body-stage {
      position: relative;
      width: min(64%, 350px);
      height: 96%;
      aspect-ratio: .67 / 1;
      min-height: 0;
    }

    .neck {
      position: absolute;
      width: 25%;
      height: 12%;
      top: 0;
      left: 37.5%;
      border: 2px solid rgba(176,114,101,.4);
      border-bottom: 0;
      border-radius: 40% 40% 0 0;
      background: var(--skin);
    }

    .torso {
      position: absolute;
      inset: 8% 2% 0;
      overflow: hidden;
      border: 2px solid rgba(176,114,101,.42);
      border-radius: 43% 43% 25% 25% / 17% 17% 9% 9%;
      background:
        linear-gradient(90deg, rgba(255,255,255,.48), transparent 22%, transparent 76%, rgba(255,255,255,.32)),
        rgba(244,207,187,.73);
      box-shadow: inset 0 0 35px rgba(255,255,255,.5), 0 12px 26px rgba(19,49,92,.13);
    }

    .rib-lines {
      position: absolute;
      inset: 10% 10% 15%;
      opacity: .28;
      background: repeating-radial-gradient(ellipse at center, transparent 0 8.3%, rgba(104,151,170,.5) 8.8% 9.4%, transparent 10% 15%);
      pointer-events: none;
    }

    .spine {
      position: absolute;
      width: 2%;
      top: 13%;
      bottom: 16%;
      left: 49%;
      border-radius: 99px;
      opacity: .45;
      background: repeating-linear-gradient(to bottom, #d7e5e6 0 9px, #8aaeb7 10px 13px);
    }

    .organ-button {
      position: absolute;
      z-index: 3;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }
    .organ-button:hover, .organ-button:focus-visible {
      z-index: 6;
      transform: scale(1.06);
      filter: brightness(1.08) drop-shadow(0 0 8px rgba(27,153,139,.58));
      outline: none;
    }
    .organ-button:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 50%; }
    .organ-shape { width: 100%; height: 100%; display: block; }

    .pulse { animation: heartPulse 1.2s ease-in-out infinite; transform-origin: center; }
    .breathe { animation: breathe 3s ease-in-out infinite; transform-origin: center; }
    .flow-dot { animation: flow 2.6s linear infinite; }
    @keyframes heartPulse { 0%,100% { transform:scale(1); } 43% { transform:scale(1.09); } 67% { transform:scale(.98); } }
    @keyframes breathe { 50% { transform:scale(1.04,1.07); } }
    @keyframes flow { to { stroke-dashoffset: -80; } }

    .labels-layer { position: absolute; inset: 0; pointer-events: none; transition: opacity .2s ease; }
    .labels-layer.is-hidden { opacity: 0; }
    .anatomy-label {
      position: absolute;
      display: flex;
      align-items: center;
      gap: .22rem;
      color: var(--navy);
      font-size: clamp(7px, .66vw, 11px);
      font-weight: 700;
      white-space: nowrap;
    }
    .anatomy-label span {
      padding: .18rem .38rem;
      border: 1px solid #c9dee6;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 2px 8px rgba(19,49,92,.1);
    }
    .anatomy-label i { display:block; width: 26px; height: 1px; background: var(--teal); transform-origin: left center; }

    .detail-panel {
      min-height: 0;
      overflow: hidden;
      border: 1px solid #cddfe7;
      border-radius: 20px;
      background: rgba(255,255,255,.92);
      box-shadow: 0 14px 32px rgba(19,49,92,.13);
      display: grid;
      grid-template-rows: 29% 12% 1fr;
    }

    .detail-hero {
      padding: 5.5% 6%;
      color: white;
      background: linear-gradient(135deg, #13315c, #1d507d);
      position: relative;
      overflow: hidden;
    }
    .detail-hero::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -60px;
      top: -75px;
      border: 24px solid rgba(155,225,215,.14);
      border-radius: 50%;
    }

    .tabs { display:flex; gap: .38rem; padding: 3% 4.5%; border-bottom: 1px solid #d9e6eb; }
    .tab-button {
      flex: 1;
      min-width: 0;
      border: 1px solid #c6d9e2;
      border-radius: 999px;
      padding: .38rem .35rem;
      font: 700 clamp(8px,.72vw,12px) "Open Sans", sans-serif;
      cursor: pointer;
      transition: .2s ease;
    }
    .tab-button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
    .tab-button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

    .panel-content { min-height: 0; padding: 4% 5%; }
    .tab-panel { display: none; height: 100%; }
    .tab-panel.is-active { display: block; }
    .panel-heading { margin: 0 0 .45rem; color: var(--navy); font: 700 clamp(13px,1.25vw,20px) "Montserrat", sans-serif; }
    .panel-copy { margin: 0; color: #36506e; font-size: clamp(9px,.82vw,13px); line-height: 1.48; }

    .empty-state { height: 100%; display:flex; align-items:center; justify-content:center; text-align:center; padding: 5%; }
    .empty-orb {
      width: clamp(56px,6vw,84px); height: clamp(56px,6vw,84px); margin: 0 auto .7rem;
      display:flex; align-items:center; justify-content:center;
      border-radius: 50%; color: var(--teal); background:#e6f4f2;
    }

    .model-layout { height:100%; display:grid; grid-template-columns: 46% 1fr; gap: 5%; align-items:center; }
    .organ-3d-zone {
      aspect-ratio: 1;
      border-radius: 16px;
      background: radial-gradient(circle at 40% 33%, #f5fbfa, #d8e9ef);
      display: flex; align-items:center; justify-content:center;
      perspective: 650px;
      cursor: grab;
      user-select:none;
      overflow:hidden;
    }
    .organ-3d-zone:active { cursor: grabbing; }
    .model-orbit { position:relative; width:72%; height:72%; transform-style:preserve-3d; transition: transform .08s linear; }
    .model-organ {
      position:absolute; inset:0;
      border-radius: 47% 50% 45% 50%;
      box-shadow: inset 13px 11px 19px rgba(255,255,255,.36), inset -18px -17px 24px rgba(89,16,38,.3), 0 17px 20px rgba(19,49,92,.2);
      background: radial-gradient(circle at 31% 24%, #ffaeb7, #e63946 49%, #9f2846);
    }
    .model-organ.lung { background:radial-gradient(circle at 28% 21%, #ffc4ca, #db8491 54%, #aa5064); border-radius:45% 49% 40% 47%; }
    .model-organ.liver { background:radial-gradient(circle at 29% 20%, #d99a7a, #a85d48 58%, #663328); border-radius:59% 34% 52% 39%; }
    .model-organ.kidney { background:radial-gradient(circle at 30% 22%, #edabb0, #b7676e 59%, #743948); clip-path:polygon(47% 0,78% 8%,100% 37%,91% 75%,61% 100%,24% 88%,4% 54%,15% 20%); }
    .model-organ.digestive { background:radial-gradient(circle at 30% 20%, #f8d09c, #db825b 58%, #a8483f); border-radius:45%; }
    .model-organ.bladder { background:radial-gradient(circle at 30% 19%, #ffe2ae, #e9a96a 54%, #bd7149); border-radius:44% 44% 53% 53%; }

    .function-layout { height:100%; display:grid; grid-template-columns: 43% 1fr; align-items:center; gap:5%; }
    .function-visual { border-radius: 16px; background:#eaf6f4; padding: 9%; }
    .steps { display:grid; grid-template-columns:1fr 1fr; gap:.48rem; }
    .step-card { padding:.55rem; border:1px solid #d7e5ea; border-radius:12px; background:#f9fbfc; }
    .step-num { width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:.25rem; background:var(--teal); color:white; font-size:9px; font-weight:700; }
    .step-text { margin:0; color:#36506e; font-size:clamp(7px,.67vw,11px); line-height:1.25; font-weight:600; }

    .footer-note { display:flex; align-items:center; justify-content:center; gap:.4rem; color:#36506e; font-size:clamp(8px,.72vw,12px); font-weight:700; }

    @media (max-width: 720px) {
      .workspace { grid-template-columns: 52% 48%; gap: 0; padding-left:1%; padding-right:1%; }
      .body-stage { width: 72%; }
      .detail-panel { border-radius: 14px; }
      .anatomy-label i { width: 12px; }
    }
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>

  <script>
    const organs = {
      heart: {
        title: "Cœur",
        description: "Muscle creux et puissant, le cœur propulse le sang vers les poumons puis vers tous les tissus du corps.",
        model: "heart",
        function: "Le cœur alterne contraction et relâchement. Ce rythme maintient en continu la circulation du sang oxygéné.",
        steps: ["Le donneur est évalué avec soin.", "Le cœur est prélevé en préservant ses vaisseaux.", "Il est protégé dans une solution froide.", "L’équipe l’implante et restaure la circulation."]
      },
      "lung-left": {
        title: "Poumon gauche",
        description: "Le poumon gauche assure les échanges entre l’air et le sang. Il possède deux lobes pour laisser de la place au cœur.",
        model: "lung",
        function: "À l’inspiration, l’air entre dans les alvéoles. L’oxygène rejoint le sang et le dioxyde de carbone repart à l’expiration.",
        steps: ["Les poumons sont évalués et protégés.", "Le poumon est séparé avec précision.", "Il voyage au froid dans une solution adaptée.", "Le chirurgien le raccorde chez le receveur."]
      },
      "lung-right": {
        title: "Poumon droit",
        description: "Le poumon droit participe aux échanges gazeux indispensables à l’organisme. Il est habituellement formé de trois lobes.",
        model: "lung",
        function: "En se gonflant et en se dégonflant, le poumon permet les échanges d’oxygène et de dioxyde de carbone avec le sang.",
        steps: ["Les poumons sont évalués et protégés.", "Le poumon est séparé avec précision.", "Il voyage au froid dans une solution adaptée.", "Le chirurgien le raccorde chez le receveur."]
      },
      liver: {
        title: "Foie",
        description: "Le foie transforme les nutriments, participe à l’élimination de substances et produit notamment la bile.",
        model: "liver",
        function: "Le foie reçoit le sang venu de l’intestin, trie les substances utiles et aide à maintenir l’équilibre interne du corps.",
        steps: ["Le foie est évalué selon un protocole précis.", "Le prélèvement préserve les vaisseaux.", "L’organe est refroidi et conditionné.", "Il est implanté puis raccordé au receveur."]
      },
      stomach: {
        title: "Estomac",
        description: "L’estomac est une poche musculaire qui mélange les aliments avec des sucs digestifs avant leur passage dans l’intestin.",
        model: "digestive",
        function: "Ses parois brassent progressivement les aliments afin de les transformer en une préparation adaptée à la digestion intestinale.",
        steps: ["La greffe d’estomac est très rare.", "Les tissus sont toujours manipulés avec soin.", "Le froid limite la dégradation des organes.", "Une équipe spécialisée accompagne chaque situation."]
      },
      "kidney-left": {
        title: "Rein gauche",
        description: "Le rein gauche filtre le sang, équilibre l’eau et les sels minéraux, puis participe à la fabrication de l’urine.",
        model: "kidney",
        function: "Le rein retient les éléments utiles, élimine certains déchets et ajuste en permanence la quantité d’eau conservée par le corps.",
        steps: ["Le rein est évalué pour la greffe.", "Il est prélevé avec ses vaisseaux.", "Il est conservé au froid.", "Il est greffé et raccordé dans le bassin."]
      },
      "kidney-right": {
        title: "Rein droit",
        description: "Le rein droit filtre le sang et participe, avec l’autre rein, à l’élimination des déchets et à l’équilibre interne.",
        model: "kidney",
        function: "Le rein filtre continuellement une partie du sang et transforme le liquide filtré en urine tout en conservant l’essentiel.",
        steps: ["Le rein est évalué pour la greffe.", "Il est prélevé avec ses vaisseaux.", "Il est conservé au froid.", "Il est greffé et raccordé dans le bassin."]
      },
      intestines: {
        title: "Intestins",
        description: "L’intestin grêle absorbe une grande partie des nutriments tandis que le côlon récupère surtout l’eau et forme les selles.",
        model: "digestive",
        function: "Des contractions régulières font avancer le contenu digestif. Les nutriments franchissent ensuite la paroi de l’intestin grêle.",
        steps: ["La greffe intestinale est rare.", "Le prélèvement demande une préparation experte.", "L’organe est protégé et transporté vite.", "La greffe se déroule dans un centre spécialisé."]
      },
      bladder: {
        title: "Vessie",
        description: "La vessie est un réservoir musculaire qui stocke l’urine produite par les reins jusqu’au moment de son évacuation.",
        model: "bladder",
        function: "Elle se distend progressivement à mesure qu’elle se remplit. Sa paroi musculaire se contracte ensuite pour permettre la miction.",
        steps: ["La greffe de vessie n’est pas habituelle.", "Cette fiche présente le soin chirurgical.", "Les tissus sont protégés avec rigueur.", "La sécurité reste prioritaire à chaque étape."]
      }
    };

    const title = document.getElementById("detail-title");
    const description = document.getElementById("detail-description");
    const functionCopy = document.getElementById("function-copy");
    const modelOrgan = document.getElementById("model-organ");
    const functionAnimation = document.getElementById("function-animation");
    const emptyState = document.getElementById("empty-state");
    const modelContent = document.getElementById("model-content");

    function drawAnimation(type) {
      const generic = `
        <path d="M20 85 C50 35 88 33 115 75 S164 130 181 81" fill="none" stroke="#1b998b" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 9" class="flow-dot"/>
        <circle cx="23" cy="85" r="10" fill="#e63946" class="pulse"/>
        <text x="100" y="155" text-anchor="middle" fill="#13315c" font-size="11" font-family="Open Sans">Schéma animé</text>`;
      const heart = `
        <path d="M99 142C77 119 47 98 47 68c0-20 24-28 38-11 7 8 10 14 18 2 14-18 39-9 39 13 0 29-25 49-43 70Z" fill="#e63946" class="pulse"/>
        <path d="M100 12v28M100 143v18" stroke="#1b998b" stroke-width="7" stroke-linecap="round"/>
        <path d="M100 17C62 23 53 46 52 64M100 158c37-4 49-25 45-42" fill="none" stroke="#1b998b" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8" class="flow-dot"/>`;
      const lungs = `
        <path d="M99 18v53" stroke="#1b998b" stroke-width="8" stroke-linecap="round"/>
        <path d="M89 49C59 24 29 45 35 95c4 36 41 38 54 7Z" fill="#df8b98" class="breathe"/>
        <path d="M110 49c30-25 60-4 54 46-4 36-41 38-54 7Z" fill="#df8b98" class="breathe"/>
        <path d="M99 35L75 57M99 35l25 22" stroke="#1b998b" stroke-width="5" stroke-linecap="round"/>`;
      functionAnimation.innerHTML = type.includes("lung") ? lungs : type === "heart" ? heart : generic;
    }

    function openDetail(id) {
      const organ = organs[id];
      if (!organ) return;
      title.textContent = organ.title;
      description.textContent = organ.description;
      functionCopy.textContent = organ.function;
      modelOrgan.className = "model-organ " + organ.model;
      ["step-1", "step-2", "step-3", "step-4"].forEach((stepId, index) => {
        document.getElementById(stepId).textContent = organ.steps[index];
      });
      emptyState.classList.add("hidden");
      modelContent.classList.remove("hidden");
      drawAnimation(id);
      activateTab("three-d");
    }

    function activateTab(tabId) {
      document.querySelectorAll("[role='tab']").forEach(button => {
        const active = button.dataset.tab === tabId;
        button.setAttribute("aria-selected", String(active));
      });
      document.querySelectorAll(".tab-panel").forEach(panel => {
        panel.classList.toggle("is-active", panel.id === tabId);
      });
    }

    document.querySelectorAll(".organ-button").forEach(button => {
      button.addEventListener("click", () => openDetail(button.dataset.organ));
    });

    document.querySelectorAll("[role='tab']").forEach(button => {
      button.addEventListener("click", () => activateTab(button.dataset.tab));
    });

    const labelLayer = document.getElementById("labels-layer");
    const labelButton = document.getElementById("labels-toggle");
    labelButton.addEventListener("click", () => {
      const visible = !labelLayer.classList.contains("is-hidden");
      labelLayer.classList.toggle("is-hidden", visible);
      labelButton.setAttribute("aria-pressed", String(!visible));
    });

    const zone = document.getElementById("organ-3d-zone");
    const orbit = document.getElementById("model-orbit");
    let dragging = false;
    let startX = 0;
    let startY = 0;
    let rotationX = -10;
    let rotationY = 18;

    function startDrag(x, y) {
      dragging = true;
      startX = x;
      startY = y;
    }

    function moveDrag(x, y) {
      if (!dragging) return;
      rotationY += (x - startX) * .6;
      rotationX -= (y - startY) * .4;
      rotationX = Math.max(-45, Math.min(45, rotationX));
      startX = x;
      startY = y;
      orbit.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
    }

    zone.addEventListener("mousedown", event => startDrag(event.clientX, event.clientY));
    window.addEventListener("mousemove", event => moveDrag(event.clientX, event.clientY));
    window.addEventListener("mouseup", () => { dragging = false; });
    zone.addEventListener("touchstart", event => startDrag(event.touches[0].clientX, event.touches[0].clientY), { passive: true });
    zone.addEventListener("touchmove", event => moveDrag(event.touches[0].clientX, event.touches[0].clientY), { passive: true });
    zone.addEventListener("touchend", () => { dragging = false; });

    lucide.createIcons();
  </script>
 </body>
