nt le courant de foudre de la tête jusqu'à la terre, par le chemin le plus court et le plus direct possible.", "regle": "Au minimum deux conducteurs de descente et deux prises de terre par paratonnerre. La pose et la fixation des conducteurs font partie des règles d'installation du programme Qualifoudre N1.", "controle": "Intégrité sur toute la longueur, fixations, cosses et connecteurs, puis continuité électrique entre le captage et la prise de terre.", "x": 0.445, "y": 0.46, "z": 0.445, "nx": 0.7, "ny": 0, "nz": 0.7}, {"cle": "joint", "titre": "Joint de contrôle", "role": "Une pièce démontable sur la descente, accessible depuis le sol, qui permet d'isoler la prise de terre pour la mesurer sans démonter le reste.", "regle": "Un joint de contrôle par conducteur de descente, accessible et repéré, placé sous le compteur de coups de foudre.", "controle": "Ouvrir le joint, mesurer la résistance de terre au telluromètre, contrôler oxydation et serrage. Les connexions oxydées ou mal serrées sont l'un des défauts les plus fréquents relevés par Indelec.", "x": 0.445, "y": 0.2, "z": 0.445, "nx": 0.7, "ny": 0, "nz": 0.7}, {"cle": "compteur", "titre": "Compteur de coups de foudre", "role": "Il enregistre chaque impact qui traverse la descente. C'est lui qui dit s'il faut déclencher la vérification après coup de foudre.", "regle": "Posé sur le conducteur de descente, au-dessus du joint de contrôle (« pose d'un compteur de coups de foudre », programme Qualifoudre N1). Le compteur intégré du Prevectron 3 Connect est testé selon la norme IEC 62561-6.", "controle": "Relever le compteur à chaque visite. Après un impact, Indelec prévoit une vérification complète dans le mois.", "x": 0.445, "y": 0.33, "z": 0.445, "nx": 0.7, "ny": 0, "nz": 0.7}, {"cle": "terre", "titre": "Prise de terre", "role": "Elle écoule le courant de foudre dans le sol. Sans bonne prise de terre, tout le reste de l'installation perd son sens.", "regle": "Deux prises de terre au minimum, réalisées selon les règles
