<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La bouche en 3D · Meujesse Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/"}}</script>
<style>
  :root { --rouge:#e4003a; --violet:#522583; --noir:#230000; --rose:#e60064; --prune:#951b81; --bleu:#4c76ba; --ciel:#b0d8f4; --jaune:#f5a04c; --blanc:#fff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: Nunito, "Avenir Next", Avenir, system-ui, sans-serif; color: var(--noir); background: linear-gradient(0deg, #b0d8f4, #ffffff); overflow:hidden; }
  .app { position:relative; width:100%; height:100%; }
  .app.radio { background: linear-gradient(135deg, #230000, #522583); color:#fff; }
  #scene { position:absolute; inset:0; }
  /* --- en-tête --- */
  .entete { position:absolute; top:18px; left:22px; z-index:5; pointer-events:none; }
  .entete h1 { margin:0; font: italic 800 26px/1.05 "Playfair Display", Georgia, serif; color: var(--rouge); letter-spacing:.02em; }
  .entete p { margin:4px 0 0; font-size:13px; opacity:.8; max-width:360px; }
  .radio .entete h1 { color:#fff; }
  /* --- barre d'outils --- */
  .barre { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:6; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:8px 10px; background:rgba(255,255,255,.72); backdrop-filter: blur(10px); border-radius:30px; box-shadow:0 4px 20px rgba(82,37,131,.14); }
  .radio .barre { background:rgba(35,0,0,.55); }
  button { font-family: inherit; font-weight:700; font-size:13px; border:2px solid transparent; border-radius:24px; padding:8px 14px; cursor:pointer; background:#fff; color:var(--violet); border-color:var(--violet); transition: .2s; }
  button:hover { background: var(--violet); color:#fff; }
  button.on { background: var(--rouge); border-color: var(--rouge); color:#fff; }
  button.on:hover { background: var(--rose); border-color: var(--rose); }
  button:disabled { opacity:.35; cursor:default; }
  .sep { width:1px; background:rgba(82,37,131,.25); margin:2px 4px; }
  /* --- infobulle de survol --- */
  .bulle { position:absolute; z-index:7; pointer-events:none; transform:translate(-50%, calc(-100% - 14px)); background:#fff; color:var(--noir); border-left:4px solid var(--rouge); border-radius:10px; padding:8px 12px; box-shadow:0 4px 20px rgba(82,37,131,.18); white-space:nowrap; opacity:0; transition:opacity .15s; }
  .bulle.on { opacity:1; }
  .bulle b { display:block; font-size:22px; color:var(--rouge); line-height:1; }
  .bulle span { display:block; font-size:12px; opacity:.85; }
  .bulle i { display:block; font-style:normal; font-size:11px; color:var(--violet); margin-top:2px; }
  .radio .bulle { background:#2a0a2a; color:#fff; }
  /* --- pastilles FDI --- */
  .pastille { position:absolute; z-index:4; transform:translate(-50%,-50%); font-size:11px; font-weight:800; color:#fff; background:var(--violet); border-radius:12px; padding:2px 6px; pointer-events:auto; cursor:pointer; box-shadow:0 2px 8px rgba(82,37,131,.3); transition: transform .15s; }
  .pastille:hover { transform:translate(-50%,-50%) scale(1.25); background:var(--rouge); }
  .pastille.cache { display:none; }
  /* --- étiquettes 3D (façon HUD) --- */
  .etq { position:absolute; z-index:5; pointer-events:none; width:0; height:0; opacity:0; transition: opacity .3s; }
  .etq.on { opacity:1; }
  .etq .pt { position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%; background:#fff; border:3px solid var(--rouge); box-shadow:0 0 0 4px rgba(228,0,58,.18); }
  .etq .fil { position:absolute; left:0; top:0; height:2px; width:var(--len,90px); background:var(--rouge); transform-origin:0 50%; transform: rotate(var(--ang,-25deg)); }
  .etq .fil::after { content:""; position:absolute; right:-3px; top:-3px; width:8px; height:8px; border-radius:50%; background:var(--rouge); }
  .etq .txt { position:absolute; left: calc(var(--len,90px) * cos(var(--ang,-25deg)) + 10px); top: calc(var(--len,90px) * sin(var(--ang,-25deg))); transform: translateY(-50%); background:#fff; color:var(--noir); border-radius:10px; padding:7px 11px; box-shadow:0 4px 20px rgba(82,37,131,.16); min-width:150px; max-width:230px; border-left:4px solid var(--rouge); }
  .etq.g .txt { left:auto; right: calc(var(--len,90px) * -1 * cos(var(--ang,-25deg)) + 10px); border-left:none; border-right:4px solid var(--rouge); text-align:right; }
  .etq .txt b { display:block; font-size:13px; color:var(--rouge); text-transform:uppercase; letter-spacing:.06em; }
  .etq .txt span { display:block; font-size:12px; line-height:1.35; }
  .etq .txt i { display:block; font-style:italic; font-size:11px; color:var(--violet); margin-top:3px; }
  .etq.c-dentine .pt, .etq.c-dentine .fil, .etq.c-dentine .fil::after { background: var(--jaune); border-color: var(--jaune); } .etq.c-dentine .txt { border-color: var(--jaune);} .etq.c-dentine .txt b { color:#c77a1a; }
  .etq.c-pulpe .pt, .etq.c-pulpe .fil, .etq.c-pulpe .fil::after { background: var(--rose); border-color: var(--rose);} .etq.c-pulpe .txt { border-color: var(--rose);} .etq.c-pulpe .txt b { color: var(--rose);}
  .etq.c-bleu .pt, .etq.c-bleu .fil, .etq.c-bleu .fil::after { background: var(--bleu); border-color: var(--bleu);} .etq.c-bleu .txt { border-color: var(--bleu);} .etq.c-bleu .txt b { color: var(--bleu);}
  .etq .pt { background:#fff !important; }
  .radio .etq .txt { background:#2a0a2a; color:#fff; }
  /* --- panneau fiche --- */
  .fiche { position:absolute; top:18px; right:18px; z-index:8; width:300px; max-height:calc(100% - 110px); overflow:auto; background:rgba(255,255,255,.88); backdrop-filter: blur(10px); border-radius:16px; padding:16px 18px; box-shadow:0 4px 20px rgba(82,37,131,.16); transform:translateX(120%); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .fiche.on { transform:none; }
  .radio .fiche { background:rgba(35,0,0,.6); color:#fff; }
  .fiche .num { font: italic 800 44px/1 "Playfair Display", Georgia, serif; color:var(--rouge); }
  .fiche .num small { font: 700 13px Nunito, sans-serif; color:var(--violet); margin-left:8px; letter-spacing:.08em; text-transform:uppercase; }
  .radio .fiche .num small { color: var(--ciel); }
  .fiche h2 { margin:6px 0 2px; font: italic 700 18px/1.2 "Playfair Display", Georgia, serif; color:var(--violet); }
  .radio .fiche h2 { color:#fff; }
  .fiche p { margin:6px 0; font-size:13px; line-height:1.45; }
  .fiche .ligne { display:flex; gap:10px; font-size:12px; margin-top:8px; }
  .fiche .ligne div { flex:1; background:rgba(176,216,244,.35); border-radius:10px; padding:6px 8px; }
  .fiche .ligne b { display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--bleu); }
  .fiche .couches { margin:12px 0 0; padding:0; list-style:none; }
  .fiche .couches li { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px solid rgba(82,37,131,.12); cursor:pointer; }
  .fiche .couches li .p { width:14px; height:14px; border-radius:50%; margin-top:3px; flex:none; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
  .fiche .couches li b { font-size:13px; } .fiche .couches li span { display:block; font-size:12px; line-height:1.35; opacity:.9; }
  .fiche .couches li i { display:block; font-size:11px; color:var(--prune); margin-top:2px; }
  .fiche .couches li.on b { color: var(--rouge); }
  .radio .fiche .couches li i { color: var(--ciel); }
  .fiche .fermer { position:absolute; top:10px; right:10px; padding:2px 9px; font-size:16px; line-height:1.2; border-radius:14px; }
  /* --- odontogramme --- */
  .odonto { position:absolute; right:18px; top:18px; z-index:6; background:rgba(255,255,255,.72); backdrop-filter:blur(10px); border-radius:16px; padding:10px 12px; box-shadow:0 4px 20px rgba(82,37,131,.14); font-size:11px; }
  .radio .odonto { background:rgba(35,0,0,.55); }
  .odonto .titre { font-weight:800; color:var(--violet); letter-spacing:.06em; text-transform:uppercase; font-size:10px; margin-bottom:6px; }
  .radio .odonto .titre { color: var(--ciel); }
  .odonto .grille { display:grid; grid-template-columns: repeat(16, 19px); gap:2px; }
  .odonto .grille .mil { grid-column: span 16; height:1px; background: var(--rouge); margin:2px 0; }
  .odonto .grille div.d { height:19px; font-size:10px; display:grid; place-items:center; border-radius:6px; background:#fff; color:var(--noir); font-weight:700; cursor:pointer; border:1px solid rgba(82,37,131,.18); transition:.15s; }
  .odonto .grille div.d:hover, .odonto .grille div.d.on { background: var(--rouge); color:#fff; border-color: var(--rouge); transform: scale(1.12); }
  .odonto .grille div.d.sel { background: var(--violet); color:#fff; }
  .odonto .legende { display:flex; justify-content:space-between; margin-top:5px; opacity:.7; font-size:10px; }
  /* --- aide --- */
  .aide { position:absolute; top:78px; left:22px; z-index:5; font-size:12px; background:rgba(255,255,255,.7); border-radius:12px; padding:6px 10px; pointer-events:none; transition:opacity .4s; }
  .aide.off { opacity:0; }
  .radio .aide { background:rgba(35,0,0,.55); }
  .charge { position:absolute; inset:0; display:grid; place-items:center; z-index:9; font: italic 700 20px "Playfair Display", serif; color:var(--violet); background:linear-gradient(0deg,#b0d8f4,#fff); transition: opacity .5s; }
  .charge.off { opacity:0; pointer-events:none; }
  .logo { position:absolute; right:22px; bottom:20px; z-index:5; font: italic 800 14px "Playfair Display", serif; color: var(--violet); opacity:.85; }
  .radio .logo { color:#fff; }
  @media (max-width: 900px) { .fiche { width: 260px; } .odonto { display:none; } .entete p { display:none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div id="scene"></div>
  <div class="charge" id="charge">Chargement de la bouche en 3D…</div>
  <div class="entete"><h1>La bouche en 3D</h1><p>Survole une dent pour lire son numéro FDI. Clique dessus pour l’isoler et explorer ses couches.</p></div>
  <div class="aide" id="aide">Glisse pour tourner · molette pour zoomer</div>
  <div class="bulle" id="bulle"></div>
  <div id="pastilles"></div>
  <div id="etiquettes"></div>
  <div class="fiche" id="fiche"></div>
  <div class="odonto" id="odonto"></div>
  <div class="barre" id="barre">
    <button data-vue="face">Face</button><button data-vue="dessus">Dessus</button><button data-vue="dessous">Dessous</button><button data-vue="cote">Profil</button>
    <div class="sep"></div>
    <button id="b-ouvrir">Ouvrir la bouche</button>
    <button id="b-num">Numéros FDI</button>
    <button id="b-radio">Radio</button>
    <div class="sep"></div>
    <button id="b-liberer" disabled>Tout revoir</button>
  </div>
  <div class="logo">Meujesse Learning</div>
</div>
<script type="module">
import { Bouche } from './src/bouche.js';
const $ = s => document.querySelector(s);
const app = $('#app'), bulle = $('#bulle'), fiche = $('#fiche'), pastilles = $('#pastilles'), etiquettes = $('#etiquettes'), odonto = $('#odonto');
const donnees = await (await fetch('assets/dents.json')).json();
let bouche;

const ETQ = {
  couronne: { cls: 'c-bleu', b: 'Couronne', s: 'La partie visible, recouverte d’émail.', ang: -22, g: false },
  collet: { cls: 'c-bleu', b: 'Collet', s: 'Là où l’émail rejoint le cément.', ang: 0, g: false },
  racine: { cls: 'c-bleu', b: 'Racine', s: 'Implantée dans l’os, recouverte de cément.', ang: 10, g: true },
  apex: { cls: 'c-bleu', b: 'Apex', s: 'La pointe de la racine : le foramen apical laisse passer nerfs et vaisseaux.', ang: 30, g: false },
  email: { cls: '', b: 'Émail', s: 'Le tissu le plus dur du corps : 97 % de minéral.', ang: -28, g: true },
  dentine: { cls: 'c-dentine', b: 'Dentine', s: 'La masse de la dent, 70 % de minéral, sensible.', ang: -10, g: false },
  pulpe: { cls: 'c-pulpe', b: 'Pulpe', s: 'Nerfs et vaisseaux : la dent vivante.', ang: 18, g: true },
};
function etiquettesPour(couche) {
  if (bouche.etat.coupe) return ['email', 'dentine', 'pulpe', 'apex'];
  return couche === 'email' ? ['couronne', 'collet', 'racine', 'apex'] : couche === 'dentine' ? ['dentine', 'collet', 'apex'] : ['pulpe', 'apex'];
}
function rendreEtiquettes() {
  etiquettes.innerHTML = '';
  for (const k in ETQ) {
    const e = ETQ[k]; const el = document.createElement('div'); el.className = 'etq ' + e.cls + (e.g ? ' g' : ''); el.dataset.k = k;
    el.style.setProperty('--ang', (e.g ? 180 - e.ang : e.ang) + 'deg'); el.style.setProperty('--len', '95px');
    el.innerHTML = `<div class="pt"></div><div class="fil"></div><div class="txt"><b>${e.b}</b><span>${e.s}</span></div>`;
    etiquettes.appendChild(el);
  }
}
rendreEtiquettes();

// Odontogramme : 18…11 | 21…28 / 48…41 | 31…38
function rendreOdonto() {
  const rang = (a, b) => { const out = []; for (let i = 8; i >= 1; i--) out.push(a * 10 + i); for (let i = 1; i <= 8; i++) out.push(b * 10 + i); return out; };
  const html = ['<div class="titre">Schéma dentaire · numérotation FDI</div><div class="grille">'];
  for (const f of rang(1, 2)) html.push(`<div class="d" data-fdi="${f}">${f}</div>`);
  html.push('<div class="mil"></div>');
  for (const f of rang(4, 3)) html.push(`<div class="d" data-fdi="${f}">${f}</div>`);
  html.push('</div><div class="legende"><span>← droite du patient</span><span>gauche du patient →</span></div>');
  odonto.innerHTML = html.join('');
  odonto.querySelectorAll('.d').forEach(el => {
    const f = +el.dataset.fdi;
    el.addEventListener('mouseenter', () => { bouche.surligner(f, true); el.classList.add('on'); });
    el.addEventListener('mouseleave', () => { bouche.surligner(f, false); el.classList.remove('on'); });
    el.addEventListener('click', () => bouche.isoler(f));
  });
}
rendreOdonto();

function montrerBulle(f, pos) {
  if (!f || !pos) { bulle.classList.remove('on'); odonto.querySelectorAll('.d.on').forEach(e => e.classList.remove('on')); return; }
  bulle.innerHTML = `<b>${f.fdi}</b><span>${f.libelle}</span><i>se lit « ${f.lecture} »</i>`;
  bulle.style.left = pos.x + 'px'; bulle.style.top = pos.y + 'px'; bulle.classList.add('on');
  odonto.querySelectorAll('.d.on').forEach(e => e.classList.remove('on'));
  const c = odonto.querySelector(`.d[data-fdi="${f.fdi}"]`); if (c) c.classList.add('on');
}
function montrerFiche(f) {
  odonto.querySelectorAll('.d.sel').forEach(e => e.classList.remove('sel'));
  if (!f) { fiche.classList.remove('on'); $('#b-liberer').disabled = true; return; }
  const c = odonto.querySelector(`.d[data-fdi="${f.fdi}"]`); if (c) c.classList.add('sel');
  $('#b-liberer').disabled = false;
  const couches = donnees.couches.filter(c => ['email', 'dentine', 'pulpe'].includes(c.cle));
  fiche.innerHTML = `<button class="fermer" id="f-fermer">×</button>
    <div class="num">${f.fdi}<small>se lit « ${f.lecture} »</small></div>
    <h2>${f.libelle}</h2>
    <p>${f.fonction}. ${f.note || ''}</p>
    <div class="ligne"><div><b>Quadrant</b>${f.quadrant}</div><div><b>Racines</b>${f.racines}</div></div>
    <div class="ligne" style="margin-top:12px"><button id="f-coupe" style="flex:1">Coupe</button><button id="f-tourne" style="flex:1" class="on">Rotation</button></div>
    <ul class="couches" id="f-couches">${couches.map((c, i) => `<li data-c="${c.cle}" class="${i === 0 ? 'on' : ''}"><div class="p" style="background:${c.couleur}"></div><div><b>${c.nom}</b><span>${c.texte}</span><i>${c.etymo}</i></div></li>`).join('')}</ul>
    <p style="font-size:11px;opacity:.7;margin-top:10px">Clique une couche pour retirer celles qui la recouvrent.</p>`;
  fiche.classList.add('on');
  $('#f-fermer').onclick = () => bouche.liberer();
  $('#f-coupe').onclick = e => { e.target.classList.toggle('on'); bouche.coupe(e.target.classList.contains('on')); };
  $('#f-tourne').onclick = e => { e.target.classList.toggle('on'); bouche.tourner(e.target.classList.contains('on')); };
  fiche.querySelectorAll('#f-couches li').forEach(li => li.onclick = () => { fiche.querySelectorAll('#f-couches li').forEach(x => x.classList.remove('on')); li.classList.add('on'); bouche.couche(li.dataset.c); });
}

function image() {
  // pastilles FDI
  if (app.classList.contains('num') && !bouche.etat.selection) {
    const cs = bouche.centres();
    if (pastilles.children.length !== cs.length) { pastilles.innerHTML = cs.map(c => `<div class="pastille" data-fdi="${c.fdi}">${c.fdi}</div>`).join(''); pastilles.querySelectorAll('.pastille').forEach(p => p.onclick = () => bouche.isoler(+p.dataset.fdi)); }
    cs.forEach((c, i) => { const el = pastilles.children[i]; el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; el.classList.toggle('cache', !c.visible); });
  } else if (pastilles.children.length) pastilles.innerHTML = '';
  // étiquettes 3D
  const a = bouche.ancres(); const actives = a ? etiquettesPour(bouche.etat.couche) : [];
  for (const el of etiquettes.children) {
    const k = el.dataset.k; const on = a && actives.includes(k) && a[k].devant;
    el.classList.toggle('on', !!on);
    if (on) { el.style.left = a[k].x + 'px'; el.style.top = a[k].y + 'px'; }
  }
}

bouche = new Bouche({ conteneur: $('#scene'), base: 'assets/', donnees, ui: {
  pret() { $('#charge').classList.add('off'); },
  survol: montrerBulle,
  selection(f) { montrerFiche(f); if (f) { $('#aide').classList.add('off'); } },
  image,
} });
window.bouche = bouche;

document.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => { if (bouche.etat.selection) bouche.liberer(); bouche.vue(b.dataset.vue); });
$('#b-ouvrir').onclick = e => { e.target.classList.toggle('on'); bouche.ouvrir(e.target.classList.contains('on')); e.target.textContent = e.target.classList.contains('on') ? 'Fermer la bouche' : 'Ouvrir la bouche'; };
$('#b-num').onclick = e => { e.target.classList.toggle('on'); app.classList.toggle('num', e.target.classList.contains('on')); };
$('#b-radio').onclick = e => { e.target.classList.toggle('on'); const on = e.target.classList.contains('on'); app.classList.toggle('radio', on); bouche.radio(on); };
$('#b-liberer').onclick = () => bouche.liberer();
$('#scene').addEventListener('pointerdown', () => $('#aide').classList.add('off'), { once: true });
</script>
</body>
</html>
