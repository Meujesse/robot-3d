<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Le village · Organiser un événement agricole</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="commun.css?v=4">
<style>
#carte{position:absolute;left:0;top:-83px;width:1600px;height:1067px;animation:plane 50s ease-in-out infinite alternate;transform-origin:55% 40%}
@keyframes plane{from{transform:scale(1.0)}to{transform:scale(1.035) translate(-8px,4px)}}
#carte img{width:100%;height:100%;display:block}
.nuage{position:absolute;width:520px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgba(20,40,30,.20),transparent);animation:nuage var(--t) linear infinite;top:var(--y);left:-600px;pointer-events:none}
@keyframes nuage{to{transform:translateX(2400px)}}
.oiseau{position:absolute;font-size:0;width:22px;height:8px;border-top:3px solid rgba(30,40,35,.65);border-radius:50% 50% 0 0;animation:vol var(--t) linear infinite;left:-40px;top:var(--y)}
.oiseau::after{content:"";position:absolute;left:19px;top:-3px;width:22px;height:8px;border-top:3px solid rgba(30,40,35,.65);border-radius:50% 50% 0 0}
@keyframes vol{to{transform:translate(1800px,-120px)}}
#chemin{position:absolute;inset:0;pointer-events:none}
#chemin path{fill:none;stroke:#fff;stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#voile{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,28,22,.55),transparent 22%,transparent 62%,rgba(14,28,22,.6));pointer-events:none}
#tete{position:absolute;left:60px;top:34px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#tete h1{margin:8px 0 0;font-size:44px;line-height:1}
.lieu{position:absolute;transform:translate(-50%,-100%);text-decoration:none;color:inherit;cursor:pointer;animation:flotte 5s ease-in-out infinite;animation-delay:var(--r)}
@keyframes flotte{50%{translate:0 -7px}}
.lieu .pin{width:74px;height:74px;margin:0 auto;border-radius:50% 50% 50% 6px;rotate:-45deg;background:var(--creme);border:5px solid var(--pre);display:grid;place-items:center;box-shadow:0 12px 22px rgba(0,0,0,.4);transition:scale .25s cubic-bezier(.2,1.6,.4,1)}
.lieu .pin span{rotate:45deg;font-size:32px}
.lieu:hover .pin{scale:1.12}
.lieu .et{margin-top:16px;background:var(--encre);color:#fff;border-radius:14px;padding:9px 14px;text-align:center;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.lieu .et b{display:block;font:800 16px/1.1 "Bricolage Grotesque"}
.lieu .et i{font:700 12.5px/1.2 Nunito;font-style:normal;color:var(--ble)}
.lieu .n{position:absolute;left:50%;top:-12px;margin-left:24px;width:30px;height:30px;border-radius:50%;background:var(--corail);color:#fff;font:800 15px/30px Nunito;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.lieu.fait .pin{background:var(--pre);border-color:#fff}
.lieu.fait .n{background:var(--pre)}
.lieu.suivant .pin{border-color:var(--ble);box-shadow:0 0 0 10px rgba(246,196,69,.35),0 12px 22px rgba(0,0,0,.4)}
#info{position:absolute;left:0;top:0;width:430px;background:var(--creme);border-radius:22px;padding:20px 22px 18px 96px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:none;z-index:30}
#info.on{display:block;animation:pop .3s both;pointer-events:none}
#info .ic{position:absolute;left:20px;top:20px;width:58px;height:58px;border-radius:20px;background:var(--pre);display:grid;place-items:center;font-size:34px}
#info .n{font:800 12px/1 Nunito;letter-spacing:.22em;text-transform:uppercase;color:var(--corail)}
#info h2{margin:5px 0 6px;font-size:24px;color:var(--pre2)}
#info p{margin:0;font:700 15px/1.45 Nunito}
#info .ou{margin-top:12px;font:800 14px/1.4 Nunito;color:var(--pre2);background:#e6f3e6;border-radius:12px;padding:10px 12px}
#info button{position:absolute;right:14px;top:12px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font:800 16px/1 Nunito;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.15)}
#act{position:absolute;inset:0;z-index:70;background:#10201a;display:none}
#act.on{display:block;animation:ouvreAct .5s cubic-bezier(.2,.9,.3,1) both}
@keyframes ouvreAct{from{opacity:0;transform:scale(1.06)}}
#act iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#retourV{position:absolute;left:50%;top:18px;translate:-50% 0;z-index:71;border:2px solid rgba(255,255,255,.75);background:rgba(28,43,36,.85);color:#fff;border-radius:99px;padding:12px 20px;font:800 15px/1 Nunito;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
#retourV:hover{background:var(--pre)}
#camille{left:40px;height:560px}
#bulle{left:330px;bottom:70px;width:440px}
#bulle::after{content:"";position:absolute;left:-13px;bottom:40px;border:13px solid transparent;border-right-color:var(--creme);border-left:0}
</style>
</head>
<body>
<div id="stage">
 <div id="carte"><img src="img/village.jpg" alt=""></div>
 <div class="nuage" style="--t:70s;--y:80px"></div><div class="nuage" style="--t:95s;--y:480px;animation-delay:-40s"></div>
 <div class="oiseau" style="--t:26s;--y:300px"></div><div class="oiseau" style="--t:34s;--y:520px;animation-delay:-12s"></div>
 <div id="voile"></div>
 <svg id="chemin" viewBox="0 0 1600 900"><path d="M800 300 C 980 300,1080 230,1210 190 M1210 190 C 1000 330,560 300,350 370 M350 370 C 640 520,1000 560,1230 500"/></svg>
 <div id="tete" class="entree"><div class="sur">Chapitre 1 · Observer et recueillir les données</div><h1>Combelune, avant la fête</h1></div>
 <div id="lieux"></div>
 <div id="camille" class="perso entree" style="--d:.2s"><img id="cImg" src="img/camille-explique.webp" alt=""></div>
 <div id="info"></div>
 <div id="act"><iframe id="cadreAct" allow="autoplay; fullscreen" title="Activité"></iframe><button id="retourV">🏘️ Retour au village</button></div>
 <div id="bulle" class="bulle entree" style="--d:.45s"><span class="qui">Camille</span><span id="bTxt"></span></div>
</div>
<script src="js/commun.js?v=4"></script>
<script>
(function(){
 const L=[
  {id:'mairie',x:800,y:250,ic:'🏛️',t:'La mairie',s:'Le projet en 7 questions',page:'questions.html',d:'Camille y a laissé ses notes en vrac. Tu les ranges sous les sept questions du diagnostic, puis tu découvres ses trois regards.'},
  {id:'foire',x:1237,y:140,ic:'🎪',t:'Le champ de foire',s:'Observer la fête de l\'an dernier',page:'terrain.html',d:'Une grande scène vivante à explorer. Cinq objets flottent dedans : attrape-les et remplis ta grille d\'observation.'},
  {id:'marche',x:331,y:325,ic:'🧺',t:'La place du marché',s:'Interroger les habitants',page:'micro.html',d:'Trois personnes, trois façons de poser la question. À toi de voir laquelle rapporte le plus d\'informations.'},
  {id:'texto',x:1248,y:455,ic:'📱',t:'Le café',s:'Débrief avec Camille',page:'texto.html',d:'Camille t\'écrit pour faire le point. Tes réponses changent ses réactions, et tu repars avec ton récap.'}];
 const Q=new URLSearchParams(location.search),FIN=Q.has('fin');
 const info=document.getElementById('info'),act=document.getElementById('act'),cadre=document.getElementById('cadreAct');
 function rendre(){
  const fait=carnet.lieux(),ok=l=>fait[l.id]||FIN,suivant=L.find(l=>!ok(l));
  document.getElementById('lieux').innerHTML=L.map((l,i)=>'<a class="lieu entree'+(ok(l)?' fait':'')+(suivant&&suivant.id===l.id?' suivant':'')+'" data-i="'+i+'" style="left:'+l.x+'px;top:'+l.y+'px;--d:'+(.3+i*.12)+'s;--r:-'+i*1.3+'s"><div class="n">'+(ok(l)?'✓':i+1)+'</div><div class="pin"><span>'+l.ic+'</span></div><div class="et"><b>'+l.t+'</b><i>'+l.s+'</i></div></a>').join('');
  document.querySelectorAll('.lieu').forEach(a=>{const l=L[+a.dataset.i];
   // au survol : la fiche du lieu · au clic : on y va
   a.onmouseenter=()=>{info.innerHTML='<div class="ic">'+l.ic+'</div><div class="n">Arrêt '+(+a.dataset.i+1)+' sur '+L.length+(ok(l)?' · déjà fait':'')+'</div><h2>'+l.t+'</h2><p>'+l.d+'</p><div class="ou">➜ Clique pour y aller</div>';
    const x=l.x>900?l.x-490:l.x+60,y=Math.min(620,Math.max(90,l.y-120));info.style.left=x+'px';info.style.top=y+'px';info.classList.remove('on');void info.offsetWidth;info.classList.add('on')};
   a.onmouseleave=()=>info.classList.remove('on');
   a.onclick=e=>{e.preventDefault();info.classList.remove('on');son.bip('pop');ouvrir(l)}});
  const nb=L.filter(ok).length;
  const txt=nb===0?'Voilà Combelune ! On a <b>quatre arrêts</b> à faire avant de lancer quoi que ce soit. Passe la souris sur un lieu pour voir ce qui t\'attend, et clique pour y aller. On commence par <b>la mairie</b> ?':
   nb<L.length?'Bien joué, ton carnet se remplit ! Prochain arrêt conseillé : <b>'+suivant.t.toLowerCase()+'</b>. Mais tu peux y aller dans l\'ordre que tu veux.':
   'On a fait le tour ! Ouvre ton <b>carnet de bord</b>, en haut à droite : tout notre diagnostic est dedans. Merci pour le coup de main !';
  document.getElementById('bTxt').innerHTML=txt;
  document.getElementById('cImg').src='img/camille-'+(nb===0?'explique':nb<L.length?'bravo':'salut')+'.webp';
 }
 function ouvrir(l){const q=new URLSearchParams(location.search);q.delete('fin');q.delete('zero');q.set('dans','1');cadre.src=l.page+'?'+q.toString();act.classList.add('on')}
 document.getElementById('retourV').onclick=()=>{act.classList.remove('on');cadre.src='about:blank';son.bip('pop');rendre();document.dispatchEvent(new Event('majCarnet'))};
 rendre();
})();
</script>
</body>
</html>
