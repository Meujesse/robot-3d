role": "Il lance et arrête la ventilation. Sur certains appareils, un interrupteur d'alimentation principal doit d'abord être actionné.", "geste": "Faire faire le geste au patient et à son entourage lors de l'installation, puis vérifier que l'appareil redémarre bien après une coupure de courant.", "x": 0.338, "y": -0.117, "z": -0.104, "nx": 1, "ny": 0, "nz": 0}, {"cle": "sortie", "titre": "Sortie d'air et raccord du circuit", "role": "C'est ici que se branche le tuyau qui va jusqu'au masque. En circuit mono-branche, l'air expiré s'échappe par la fuite calibrée du masque ou par une valve expiratoire.", "geste": "Vérifier l'emboîtement du circuit, contrôler l'usure du tuyau et le remplacer à l'intervalle prévu. Une alarme de fuite importante commence souvent par une vérification ici et au masque.", "x": 0.4, "y": -0.13, "z": 0.263, "nx": 1, "ny": 0, "nz": 0}, {"cle": "humidificateur", "titre": "Humidificateur chauffant", "role": "Un réservoir d'eau posé sur une plaque chauffante humidifie l'air insufflé. Sans lui, l'air brassé par la turbine peut être trop froid ou trop sec et provoquer une bouche sèche.", "geste": "Remplir jusqu'au niveau maximum sans le dépasser, vider le réservoir avant tout transport, régler la température par paliers pour éviter la condensation dans le circuit. Rappeler l'entretien : vidange chaque jour, lavage chaque semaine.", "x": -0.07, "y": 0.15, "z": -0.5, "nx": 0, "ny": 0, "nz": -1}, {"cle": "trappe", "titre": "Trappe carte SD et données", "role": "L'appareil enregistre les heures d'utilisation, les fuites et les événements de la nuit sur une carte mémoire ou les transmet par télésuivi. Ces données servent au compte rendu envoyé au médecin.", "geste": "Relever les données à chaque visite (carte SD ou plateforme de télésuivi), vérifier l'observance et signaler toute anomalie au prescripteur.", "x": -0.003, "y": 0.415, "z": 0.236, "nx": 0, "ny": 1, "nz": 0}, {"cle": "filtre", "titre": "Capot du filtre à air", "role": "Derrière ce capot, un filtre retient la poussière de l'air ambiant avant qu'elle n'entre dans la turbine. Il protège la machine et l'air envoyé au patient.", "geste": "Contrôler le filtre à chaque visite et le remplacer au moins tous les six mois, plus souvent si le logement est poussiéreux ou enfumé. Le filtre est fourni et changé par le technicien.", "x": -0.464, "y": -0.101, "z": -0.127, "nx": -1, "ny": 0, "nz": 0}, {"cle": "prise", "titre": "Prise d'alimentation et batterie", "role": "Le ventilateur fonctionne sur secteur. Beaucoup d'appareils embarquent une batterie interne qui prend le relais en cas de coupure, avec une autonomie variable selon les réglages.", "geste": "Vérifier le câble et son clip de maintien, tester l'alarme de coupure secteur et la batterie à chaque visite, prévoir une batterie externe pour les patients à faible autonomie respiratoire.", "x": -0.47, "y": -0.28, "z": 0.28, "nx": -1, "ny": 0, "nz": 0}], "simulateur": true, "cleSimulateur": "ecran", "libelleSimulateur": "Essayer l'écran et les commandes", "titreSimulateur": "Simulateur d'écran : que se passe-t-il quand on appuie ?"};
