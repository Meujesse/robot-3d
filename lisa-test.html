<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisa : banc d’essai</title>
<script src="lisa-rig.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #6fb3c3; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: grid; grid-template-rows: 1fr auto; height: 100%; }
  #stage { width: 100%; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(0,0,0,.35); align-items: center; }
  .bar button { font: inherit; font-size: 12px; padding: 5px 9px; border: 0; border-radius: 6px; background: #fff; cursor: pointer; }
  .bar button.on { background: #f5b400; }
  .bar label { color: #fff; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <div class="bar" id="bar">
    <label>Plan <select id="plan"><option>pied</option><option>americain</option><option selected>buste</option><option>gros</option></select></label>
    <label>Ouv. <input id="ouv" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><input id="parle" type="checkbox"> parle (simulé)</label>
    <label><input id="auto" type="checkbox"> défilé</label>
  </div>
</div>
<script>
(async () => {
  const stage = document.getElementById('stage');
  const lisa = LisaRig.create({ stage, onPose: (n, p) => { document.querySelectorAll('#bar button').forEach(b => b.classList.toggle('on', b.textContent === n)); document.getElementById('plan').value = p; } });
  await lisa.init();
  const bar = document.getElementById('bar');
  for (const n of lisa.poses()) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => lisa.setPose(n, { plan: document.getElementById('plan').value, force: true }); bar.appendChild(b); }
  document.getElementById('plan').onchange = e => lisa.setPlan(e.target.value);
  const ouv = document.getElementById('ouv');
  ouv.oninput = () => { lisa.setState('idle'); lisa._bouche(+ouv.value, 0, 0); };
  let sim = null;
  document.getElementById('parle').onchange = e => {
    if (e.target.checked) {
      const start = performance.now();
      lisa.nourrit("Coucou, moi c'est Lisa ! Je suis là pour t'accompagner. Tu veux qu'on commence par quoi ? Une petite question, ou un exercice pour se chauffer ?");
      lisa.setAmpSource(() => { const k = (performance.now() - start) / 1000; return 0.35 + 0.35 * Math.abs(Math.sin(k * 9)) * (0.6 + 0.4 * Math.sin(k * 2.3)); });
      lisa.setState('speaking');
    } else { lisa.setState('listening'); lisa.setAmpSource(null); }
  };
  document.getElementById('auto').onchange = e => {
    if (e.target.checked) { const ps = lisa.poses(); let i = 0; sim = setInterval(() => lisa.setPose(ps[i++ % ps.length], { force: true }), 2500); }
    else clearInterval(sim);
  };
  window.lisa = lisa;
  const p = new URLSearchParams(location.search);
  if (p.get('pose')) await lisa.setPose(p.get('pose'), { plan: p.get('plan') || undefined, force: true });
  if (p.get('ouv')) lisa._bouche(+p.get('ouv'), 0, 0);
})();
</script>
</body>
</html>
