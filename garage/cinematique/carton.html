<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Néon Garage · carton de titre de la cinématique</title>
<style>
/* Carton de fin de la cinématique, 1920 x 1080. ?couche=fond (image seule) ou ?couche=titre (titre sur fond transparent) */
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&display=swap');
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
.fond{position:absolute;inset:0;background:#140B2E url(../img/atelier-sombre.jpg) center/cover}
.fond::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(20,11,46,.25) 0%,rgba(20,11,46,.78) 78%)}
.titre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.titre img{width:860px;filter:drop-shadow(0 18px 40px rgba(255,45,138,.45))}
.mission{display:flex;align-items:center;gap:22px;margin-top:-6px}
.mission b{font:400 34px/1 "Anton",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#140B2E;background:linear-gradient(92deg,#FFB36B 0%,#FF5FA2 48%,#B14CFF 100%);padding:12px 22px 10px;border-radius:10px;transform:skewX(-8deg)}
.mission span{font:700 52px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;color:#fff;text-shadow:0 4px 0 #140B2E,0 0 26px rgba(255,45,138,.6)}
body.fond .titre,body.titre .fond{display:none}
</style>
</head>
<body>
<div class="fond"></div>
<div class="titre">
  <img src="../img/ui/titre-neon-garage.png" alt="Néon Garage">
  <div class="mission"><b>Mission 1</b><span>La citadine qui tire à droite</span></div>
</div>
<script>
const c = new URLSearchParams(location.search).get('couche'); if (c) document.body.classList.add(c);
</script>
</body>
</html>
