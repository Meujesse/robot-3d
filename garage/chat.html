<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Néon Garage · Conversation avec le client</title>
<link rel="stylesheet" href="commun.css">
<style>
/* Page transparente : le fond, le bandeau, la colonne de droite et le bouton de suite sont posés dans Genially.
   ?fond=1 ajoute le décor pour regarder la page seule. */
html,body{background:transparent}
#scene{background:transparent}
body.fond #scene{background:#1E1245 url(img/atelier-sombre.jpg) center/cover}
/* Inès et sa bulle */
.ines{position:absolute;left:118px;bottom:-6px;height:530px;z-index:2;animation:entre .8s both}
.ines img{height:100%;display:block;filter:drop-shadow(0 18px 26px rgba(0,0,0,.5))}
@keyframes entre{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.bulle{position:absolute;left:20px;top:56px;width:352px;min-height:96px;background:#fff;border-radius:18px;padding:13px 62px 14px 18px;font-size:16px;line-height:1.36;color:#1E1245;box-shadow:0 12px 28px rgba(0,0,0,.3);z-index:3;transition:transform .2s}
.bulle::after{content:"";position:absolute;right:54px;bottom:-16px;border:12px solid transparent;border-top:16px solid #fff;border-bottom:0}
.bulle .tag{display:none;font:700 11px/1 var(--f-hud);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.bulle.ok .tag,.bulle.ko .tag,.bulle.bof .tag{display:block}
.bulle.ok .tag{color:#0E8F63}.bulle.bof .tag{color:#C26A00}.bulle.ko .tag{color:#D02247}
.bulle.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.voix{left:318px;top:66px;width:46px;height:46px}
.voix svg{width:24px;height:24px}
/* téléphone */
.tel{position:absolute;left:400px;top:14px;width:400px;height:646px;border-radius:44px;background:#0B0820;border:6px solid #2A1A5E;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.08);overflow:hidden;z-index:4;animation:monte .7s both}
@keyframes monte{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.encoche{position:absolute;left:50%;top:12px;width:120px;height:26px;margin-left:-60px;border-radius:14px;background:#000;z-index:3}
.heure{position:absolute;right:24px;top:15px;font:600 13px/1 var(--f-hud);letter-spacing:.06em;color:#fff;z-index:4}
.haut{position:absolute;left:0;right:0;top:0;height:108px;background:linear-gradient(180deg,#2A1A5E,#1E1245);border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:flex-end;padding:0 22px 12px;gap:14px;z-index:2}
.haut .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--violet));display:grid;place-items:center;font:400 21px/1 var(--f-titre);color:#fff}
.haut b{display:block;font:700 19px/1.1 var(--f-hud);letter-spacing:.04em}
.haut small{display:block;font:500 13px/1.2 var(--f-texte);color:var(--ok)}
.fil{position:absolute;left:0;right:0;top:108px;bottom:0;padding:14px 14px 150px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none}
.fil::-webkit-scrollbar{display:none}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.34;animation:msg .3s both;flex:none}
@keyframes msg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.eux{align-self:flex-start;background:#2A1A5E;border-bottom-left-radius:6px;color:#fff}
.msg.moi{align-self:flex-end;background:linear-gradient(135deg,var(--rose),var(--violet));border-bottom-right-radius:6px;color:#fff}
.msg.sys{align-self:center;max-width:92%;text-align:center;background:rgba(77,227,255,.12);border:1px solid rgba(77,227,255,.5);color:#DFF8FF;font:600 14px/1.35 var(--f-texte);border-radius:12px}
.points{display:inline-flex;gap:4px;align-items:center;height:16px}
.points b{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.4;animation:tape 1s infinite}
.points b:nth-child(2){animation-delay:.2s}.points b:nth-child(3){animation-delay:.4s}
@keyframes tape{50%{opacity:1;transform:translateY(-3px)}}
/* zone de réponse : remplace le clavier */
.reponses{position:absolute;left:0;right:0;bottom:0;background:#120C2E;border-top:1px solid rgba(255,255,255,.12);padding:10px 12px 14px;z-index:3;display:grid;gap:7px;transform:translateY(100%);transition:transform .35s}
.reponses.on{transform:none}
.reponses .k{font:600 11px/1 var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:var(--gris);padding-left:4px}
.reponses button{text-align:left;border:1.5px solid #FF5FA2;background:rgba(255,255,255,.05);color:#fff;border-radius:14px;padding:8px 12px;font:600 14px/1.3 var(--f-texte);transition:.15s}
.reponses button:hover{background:rgba(255,45,138,.2);transform:translateX(3px)}
.saisie{position:absolute;left:0;right:0;bottom:0;height:62px;background:#120C2E;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:2}
.saisie span{flex:1;height:38px;border-radius:19px;background:#1E1245;display:flex;align-items:center;padding:0 16px;color:#6F63A0;font-size:15px}
.saisie i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--violet));display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
/* flèche vers le bouton de suite (posé dans Genially, à droite) */
.vers{position:absolute;left:812px;top:596px;z-index:5;font:700 15px/1 var(--f-hud);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);text-shadow:0 0 10px rgba(77,227,255,.8);opacity:0;transition:opacity .4s}
.vers.on{opacity:1;animation:vers 1s ease-in-out infinite}
@keyframes vers{50%{transform:translateX(8px)}}
</style>
</head>
<body>
<div id="scene">
  <div class="ines"><img src="img/ines-telephone.webp?v=1" alt="Inès, cheffe d'atelier, regarde le téléphone"></div>
  <div class="bulle" id="bulle"><div class="tag" id="tag"></div><span id="bt"></span></div>
  <div class="tel">
    <div class="encoche"></div><div class="heure" id="heure"></div>
    <div class="haut"><div class="avatar">M</div><div><b>M. Haddad · client</b><small>en ligne</small></div></div>
    <div class="fil" id="fil"></div>
    <div class="saisie"><span>Message…</span><i>›</i></div>
    <div class="reponses" id="reponses"></div>
  </div>
  <div class="vers" id="vers">›››</div>
</div>
<script src="commun.js"></script>
<script>
// Deux conversations : ?c=brief (prise en charge) et ?c=rendre (restitution). Chaque choix : [ma réplique, réponse du client, retour d'Inès, niveau, fichier voix]
const CONV = {
  brief: {
    heure: '17:42', intro: 'Le client écrit. À toi de répondre : choisis la bonne réplique.', voix0: 'brief-0',
    debut: ['Bonjour, c’est pour la citadine grise déposée ce matin 👋', 'Depuis une semaine elle tire à droite sur la rocade, et le volant vibre passé 90.'],
    tours: [
      [['Bonjour M. Haddad. Depuis quand exactement, et ça vibre dans le volant ou dans tout l’habitacle ?', 'Une semaine, depuis un gros trou dans la chaussée. Dans le volant surtout. Il me la faut pour 19 h, je bosse demain à 6 h.', 'Bonne question : tu cherches les faits avant de conclure.', 'ok', 'brief-a1'],
       ['Ok, c’est sûrement les freins. On change les plaquettes.', 'Ah bon ? Sans regarder ? Bon… Il me la faut pour 19 h, je bosse demain à 6 h.', 'Jamais de pièce avant le diagnostic. Le client paierait pour rien.', 'ko', 'brief-a2'],
       ['Bonjour. On regarde ça quand on a le temps.', 'Euh… il me la faut pour 19 h, je bosse demain à 6 h.', 'Un client inquiet a besoin d’un cadre : quand, quoi, combien.', 'ko', 'brief-a3']],
      [['On la monte sur le pont tout de suite. Diagnostic d’ici une heure, et je vous appelle avant toute réparation.', 'Parfait, merci. J’attends votre appel 🙏', 'Parfait : un délai, un diagnostic, un appel avant de réparer.', 'ok', 'brief-b1'],
       ['Pas de souci, ce sera prêt à 19 h.', 'Super. Vous me direz combien ?', 'Prudence : tu promets sans savoir ce qu’il y a.', 'bof', 'brief-b2'],
       ['19 h, c’est impossible.', 'Bon… tenez-moi au courant alors.', 'Avant de refuser, fais le diagnostic : tu sauras si c’est faisable.', 'ko', 'brief-b3']],
    ],
    fin: 'Conversation terminée. Quand tu es prêt, clique sur « Accepter la mission ».',
  },
  rendre: {
    heure: '18:36', intro: 'Le client veut des nouvelles. Explique-lui simplement ce que tu as fait.', voix0: 'rendre-0',
    debut: ['Alors, verdict ? Elle est prête ?'],
    tours: [
      [['Pneu avant droit sous-gonflé et usé, masse d’équilibrage perdue. Roue remplacée, équilibrée, parallélisme contrôlé : elle file droit.', 'Clair, merci ! Et pour éviter que ça revienne ?', 'Clair et complet : la cause, le geste, le résultat.', 'ok', 'rendre-a1'],
       ['Balourd sur l’AVD avec un décalage du pincement, on a repris la géo.', 'Euh… je n’ai rien compris 😅 Et pour éviter que ça revienne ?', 'Trop de jargon : il n’a rien compris.', 'ko', 'rendre-a2'],
       ['C’est réparé.', 'Réparé quoi ? Et pour éviter que ça revienne ?', 'Trop court : il ne sait pas ce qu’il paie.', 'ko', 'rendre-a3']],
      [['Vérifiez la pression une fois par mois, 2,3 bar à froid, et levez le pied sur les trous.', 'Noté. Merci, à 19 h !', 'Le bon conseil : simple, chiffré, applicable.', 'ok', 'rendre-b1'],
       ['Changez de voiture 😅', 'Ha ha. Bon, à 19 h.', 'Drôle, mais pas pro. Le client attend un conseil.', 'bof', 'rendre-b2'],
       ['Rien à faire, c’est l’usure.', 'Ah. Bon, à 19 h.', 'Faux : la pression se vérifie, l’usure se prévient.', 'ko', 'rendre-b3']],
    ],
    fin: 'Conversation terminée. Clique sur « Terminer la mission ».',
  },
};
const Q = new URLSearchParams(location.search); const C = CONV[Q.get('c')] || CONV.brief;
if (Q.has('fond')) document.body.classList.add('fond');
const fil = document.getElementById('fil'), rep = document.getElementById('reponses'), bulle = document.getElementById('bulle'), bt = document.getElementById('bt'), tag = document.getElementById('tag');
document.getElementById('heure').textContent = C.heure; bt.textContent = C.intro;
const TAGS = { ok: 'Bon réflexe', bof: 'À nuancer', ko: 'À éviter' };
const attends = ms => new Promise(r => setTimeout(r, Q.has('vite') ? 30 : ms));
const bas = () => { fil.scrollTop = fil.scrollHeight; };
// La voix d'Inès : bouton d'écoute pour la consigne, puis elle réagit à voix haute à chaque choix (jamais sans clic, et jamais avec ?muet)
let piste = null; const bv = boutonVoix(C.voix0, '');
function dis(fichier){ if (MUET) return; try { if (piste) piste.pause(); piste = new Audio('audio/' + fichier + '.mp3?v=2'); piste.play().catch(() => {}); } catch (e) {} }
async function client(texte){
  const m = document.createElement('div'); m.className = 'msg eux'; m.innerHTML = '<span class="points"><b></b><b></b><b></b></span>'; fil.appendChild(m); bas();
  await attends(700 + Math.min(1300, texte.length * 14)); m.textContent = texte; bas(); await attends(500);
}
function propose(tour){
  rep.innerHTML = '<div class="k">Choisis ta réponse</div>';
  C.tours[tour].forEach(ch => { const b = document.createElement('button'); b.textContent = ch[0]; b.onclick = () => choisis(tour, ch); rep.appendChild(b); });
  rep.classList.add('on'); fil.style.paddingBottom = (rep.offsetHeight + 14) + 'px'; bas();
}
async function choisis(tour, ch){
  rep.classList.remove('on'); fil.style.paddingBottom = '76px';
  const m = document.createElement('div'); m.className = 'msg moi'; m.textContent = ch[0]; fil.appendChild(m); bas();
  // Inès commente tout de suite, à l'écrit et à voix haute
  bulle.className = 'bulle pop ' + ch[3]; tag.textContent = TAGS[ch[3]]; bt.textContent = ch[2]; bv.style.display = 'none'; dis(ch[4]);
  await attends(600); await client(ch[1]);
  if (tour + 1 < C.tours.length) propose(tour + 1);
  else { await attends(300); const s = document.createElement('div'); s.className = 'msg sys'; s.textContent = C.fin; fil.appendChild(s); bas(); document.getElementById('vers').classList.add('on'); }
}
(async () => { await attends(600); for (const t of C.debut) await client(t); propose(0); })();
</script>
</body>
</html>
