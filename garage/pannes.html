<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Néon Garage · Les pannes qui changent la conduite</title>
<link rel="stylesheet" href="commun.css">
<style>
#scene{background:#1E1245 url(img/atelier-sombre.jpg) center/cover}
h1{position:absolute;left:34px;top:58px;margin:0;font:400 40px/1 var(--f-titre);text-transform:uppercase;letter-spacing:.02em;color:#fff;text-shadow:0 4px 0 rgba(60,10,90,.6);z-index:5}
h1 em{font-style:normal;background:var(--degrade);-webkit-background-clip:text;background-clip:text;color:transparent}
.sous{position:absolute;left:36px;top:106px;width:430px;font-size:15.5px;line-height:1.4;color:#EDE7FF;z-index:5}
.sous b{color:var(--peche)}
/* liste des pannes */
.liste{position:absolute;left:34px;top:160px;width:430px;display:grid;gap:8px;z-index:5}
.panne{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid rgba(255,255,255,.14);background:rgba(20,11,46,.75);color:#fff;border-radius:10px;padding:9px 12px;font:500 15px/1.25 var(--f-texte);transition:.15s}
.panne:hover{border-color:var(--rose);background:rgba(255,45,138,.14)}
.panne.on{border-color:var(--cyan);background:rgba(77,227,255,.12);box-shadow:0 0 16px rgba(77,227,255,.25)}
.panne.vue b::after{content:"✓";position:absolute;right:-6px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#06281c;font:700 11px/16px var(--f-texte);text-align:center}
.panne b{position:relative;flex:none;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--rose),var(--violet));display:grid;place-items:center;font:400 17px/1 var(--f-titre)}
.panne span small{display:block;font-size:12.5px;color:var(--gris);margin-top:2px}
/* piste vue de dessus */
.piste{position:absolute;left:490px;top:100px;width:676px;height:400px;border-radius:14px;overflow:hidden;background:#231A45;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:4}
.piste .herbe{position:absolute;left:0;right:0;height:62px;background:#1a1240}
.piste .herbe.h{top:0}.piste .herbe.b{bottom:0}
.piste .bord{position:absolute;left:0;right:0;height:11px;background:repeating-linear-gradient(90deg,#FF5FA2 0 34px,#fff 34px 68px);animation:bord .55s linear infinite}
.piste .bord.h{top:62px}.piste .bord.b{bottom:62px}
@keyframes bord{to{background-position:-68px 0}}
.piste .lignes{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2px;background:repeating-linear-gradient(90deg,#FFD36E 0 56px,transparent 56px 112px);animation:lignes .5s linear infinite}
@keyframes lignes{to{background-position:-112px 0}}
.piste.repos .bord,.piste.repos .lignes,.piste.stop .bord,.piste.stop .lignes{animation-play-state:paused}
.piste .flaque{position:absolute;left:330px;top:95px;width:300px;height:210px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(77,227,255,.4),rgba(77,227,255,.14) 60%,transparent 72%);opacity:0;transition:opacity .5s}
.piste .repere{position:absolute;left:470px;top:73px;bottom:73px;width:4px;background:#fff;opacity:0;transition:opacity .5s}
.piste .repere::after{content:"ARRÊT VOULU";position:absolute;left:8px;top:6px;white-space:nowrap;font:600 11px/1 var(--f-hud);letter-spacing:.14em;color:#fff}
.piste .bosse{position:absolute;top:73px;bottom:73px;width:16px;border-radius:8px;background:rgba(255,211,110,.5);opacity:0}
.piste .vit{position:absolute;right:16px;top:12px;font:400 30px/1 var(--f-titre);color:#fff;z-index:3}
.piste .vit small{font:600 12px/1 var(--f-hud);letter-spacing:.1em;color:var(--gris);margin-left:5px}
.piste .nom{position:absolute;left:16px;top:14px;font:600 13px/1 var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:#fff;z-index:3}
.piste .etat{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 12px;border-radius:6px;font:600 13px/1 var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(20,11,46,.8);border:1px solid rgba(255,255,255,.2);z-index:3;transition:.3s}
.piste .etat.alerte{background:rgba(255,77,109,.9);border-color:#fff}
.piste .attente{position:absolute;inset:0;display:grid;place-items:center;font:600 15px/1 var(--f-hud);letter-spacing:.18em;text-transform:uppercase;color:#fff;background:rgba(10,6,28,.55);z-index:4;transition:opacity .4s}
.piste .attente.off{opacity:0;pointer-events:none}
/* la voiture : un conteneur pour la trajectoire, un autre pour les secousses */
.auto{position:absolute;left:110px;top:50%;width:200px;margin-top:-48px}
.auto .caisse{width:200px;height:96px}
.auto svg{width:200px;height:96px;display:block}
.auto .stop{opacity:0}
/* le volant : ce que sent le conducteur */
.volant{position:absolute;left:16px;top:44px;width:74px;height:74px;z-index:3;opacity:0;transition:opacity .4s}
.piste:not(.repos) .volant{opacity:1}
.volant svg{width:100%;height:100%;display:block}
.volant small{position:absolute;left:0;right:0;top:78px;text-align:center;font:600 10px/1 var(--f-hud);letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}

/* ----- phase normale : la voiture avance droit ----- */
.piste.normal .auto{animation:normal 1.6s linear forwards}
@keyframes normal{to{transform:translateX(40px)}}
/* ----- 1. tire à droite : dérive progressive, le conducteur contre-braque ----- */
.piste.p-tire .auto{animation:tire 3.6s ease-in forwards}
@keyframes tire{0%{transform:translate(40px,0) rotate(0)}40%{transform:translate(120px,26px) rotate(4deg)}100%{transform:translate(330px,132px) rotate(9deg)}}
.piste.p-tire .volant svg{animation:vTire 3.6s ease-in forwards}
@keyframes vTire{to{transform:rotate(-38deg)}}
/* ----- 2. vibration : la voiture tient sa ligne mais tremble, de plus en plus ----- */
.piste.p-vibre .auto{animation:avance 3.6s linear forwards}
@keyframes avance{from{transform:translateX(40px)}to{transform:translateX(250px)}}
.piste.p-vibre .caisse{animation:vib .07s linear infinite}
@keyframes vib{0%{transform:translate(0,0)}25%{transform:translate(2.5px,-2.5px)}50%{transform:translate(-2.5px,2.5px)}75%{transform:translate(2.5px,2.5px)}100%{transform:translate(-2.5px,-2.5px)}}
.piste.p-vibre .volant svg{animation:vVib .08s linear infinite}
@keyframes vVib{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
/* ----- 3. parallélisme : la voiture louvoie, corrections permanentes ----- */
.piste.p-zigzag .auto{animation:zigzag 3.6s ease-in-out forwards}
@keyframes zigzag{0%{transform:translate(40px,0) rotate(0)}20%{transform:translate(95px,24px) rotate(6deg)}40%{transform:translate(150px,-10px) rotate(-7deg)}60%{transform:translate(205px,30px) rotate(7deg)}80%{transform:translate(260px,-8px) rotate(-6deg)}100%{transform:translate(315px,28px) rotate(6deg)}}
.piste.p-zigzag .volant svg{animation:vZig .72s ease-in-out infinite alternate}
@keyframes vZig{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
/* ----- 4. amortisseur : après la bosse, la caisse rebondit encore et encore ----- */
.piste.p-rebond .auto{animation:avance 3.6s linear forwards}
.piste.p-rebond .caisse{animation:rebond .5s ease-in-out .5s 6}
@keyframes rebond{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.piste.p-rebond .bosse{opacity:1;left:480px;animation:bosse 1.1s linear forwards}
@keyframes bosse{from{left:480px}to{left:120px;opacity:.9}}
.piste.p-rebond .volant svg{animation:vReb .5s ease-in-out .5s 6}
@keyframes vReb{50%{transform:translateY(-5px)}}
/* ----- 5. étrier grippé : au freinage, la voiture part de travers ----- */
.piste.p-freine .auto{animation:freine 3.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes freine{0%{transform:translate(40px,0) rotate(0)}35%{transform:translate(190px,0) rotate(0)}70%{transform:translate(300px,-34px) rotate(-11deg)}100%{transform:translate(335px,-58px) rotate(-17deg)}}
.piste.p-freine .stop,.piste.p-glisse .stop{animation:feux 3.6s forwards}
@keyframes feux{0%,30%{opacity:0}36%,100%{opacity:1}}
.piste.p-freine .volant svg{animation:vFrein 3.6s forwards}
@keyframes vFrein{0%,35%{transform:rotate(0)}70%,100%{transform:rotate(-34deg)}}
/* ----- 6. pneus lisses sous la pluie : le freinage n'en finit plus ----- */
.piste.p-glisse .auto{animation:glisse 3.6s cubic-bezier(.3,.3,.6,1) forwards}
@keyframes glisse{0%{transform:translate(40px,0) rotate(0)}100%{transform:translate(500px,-16px) rotate(-7deg)}}
.piste.p-glisse .volant svg{animation:vGlisse .5s ease-in-out 1.2s 5 alternate}
@keyframes vGlisse{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}

/* fiche explicative */
.fiche{position:absolute;left:490px;top:514px;width:676px;height:130px;padding:14px 18px;z-index:5;display:grid;grid-template-columns:1fr 1fr;gap:16px;opacity:0;transition:opacity .4s}
.fiche.on{opacity:1}
.fiche .k{font:600 12px/1 var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
.fiche p{margin:0;font-size:14.5px;line-height:1.35;color:#EDE7FF}
.fiche p b{color:#fff}
</style>
</head>
<body>
<div id="scene">
  <div class="bandeau"><span class="hud"><b>Néon Garage</b> · Mission 1</span><span class="hud">Réputation <span class="etoiles"><i class="on">★</i><i>★</i><i>★</i><i>★</i><i>★</i></span></span></div>
  <h1>Ce que la panne <em>fait à la route</em></h1>
  <div class="sous"><b>Clique sur une panne</b> : la voiture roule d'abord normalement, puis la panne apparaît.</div>
  <div class="liste" id="liste"></div>
  <div class="piste repos" id="piste">
    <div class="herbe h"></div><div class="herbe b"></div>
    <div class="bord h"></div><div class="lignes"></div><div class="bord b"></div>
    <div class="flaque" id="flaque"></div><div class="repere" id="repere"></div><div class="bosse"></div>
    <div class="nom" id="nom">Rocade · essai</div>
    <div class="vit" id="vit">0<small>km/h</small></div>
    <div class="volant"><svg viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="30" fill="none" stroke="#fff" stroke-width="7"/><circle cx="37" cy="37" r="8" fill="#fff"/><path d="M9 34h56M37 45v22" stroke="#fff" stroke-width="6" stroke-linecap="round"/><rect x="33" y="3" width="8" height="9" rx="2" fill="#FF2D8A"/></svg><small>Au volant</small></div>
    <div class="auto" id="auto"></div>
    <div class="etat" id="etat">En attente</div>
    <div class="attente" id="attente">Choisis une panne à gauche</div>
  </div>
  <div class="fiche carte" id="fiche"></div>
</div>
<script src="commun.js"></script>
<script>
const PANNES = [
  { id: 'tire', nom: 'Pneu avant sous-gonflé d’un côté', sous: 'La voiture tire du côté du pneu mou', vit: 90, alerte: 'Elle tire à droite', volant: 'La voiture <b>tire d’un côté</b> dès qu’on lâche le volant, surtout sur route plate. Il faut la retenir en permanence.', cause: 'Le pneu mou a plus de résistance au roulement et s’écrase : la voiture tourne vers lui. Même cause possible : <b>parallélisme déréglé</b> après un trou ou un trottoir.' },
  { id: 'vibre', nom: 'Roue mal équilibrée', sous: 'Le volant vibre à partir de 80-90 km/h', vit: 95, alerte: 'Le volant vibre', volant: 'Le volant <b>tremble à une vitesse précise</b>, souvent entre 80 et 110 km/h, puis ça se calme plus vite ou moins vite.', cause: 'Une <b>masse d’équilibrage perdue</b> ou un pneu usé en facettes : la roue n’a plus la même masse partout, elle oscille à chaque tour.' },
  { id: 'zigzag', nom: 'Parallélisme déréglé', sous: 'Direction floue, on corrige sans arrêt', vit: 80, alerte: 'Elle ne tient pas le cap', volant: 'La voiture <b>ne tient pas le cap</b> : on corrige sans cesse, le volant n’est plus centré en ligne droite.', cause: 'Les roues avant ne sont plus parallèles (pincement ou ouverture). Elles <b>tirent chacune de leur côté</b>, et les pneus s’usent vite sur un bord.' },
  { id: 'rebond', nom: 'Amortisseur hors service', sous: 'La voiture rebondit après chaque bosse', vit: 70, alerte: 'Elle rebondit après la bosse', volant: 'Après une bosse, la caisse <b>continue de rebondir</b>, l’avant plonge au freinage, la tenue de route devient flottante.', cause: 'L’amortisseur ne freine plus le ressort. Test simple : on appuie fort sur l’aile, elle doit <b>remonter une seule fois</b>.' },
  { id: 'freine', nom: 'Étrier de frein grippé', sous: 'Au freinage, la voiture part de travers', vit: 90, freine: 9, alerte: 'Au freinage, elle part à gauche', volant: 'Au freinage, la voiture <b>se déporte brusquement</b> d’un côté. Odeur de chaud et jante brûlante après un trajet.', cause: 'Un étrier ne libère plus la plaquette : une roue freine plus que l’autre, parfois en permanence. Risque d’<b>échauffement du disque</b>.' },
  { id: 'glisse', nom: 'Pneus lisses sur sol mouillé', sous: 'Le freinage n’en finit plus', vit: 90, freine: 3.4, alerte: 'Elle dépasse le point d’arrêt', volant: 'Sur chaussée mouillée, la voiture <b>flotte</b> : le freinage s’allonge, la direction devient légère, l’ABS s’active.', cause: 'Sous 1,6 mm de sculpture, le pneu n’évacue plus l’eau : <b>aquaplaning</b>. Un pneu neuf freine jusqu’à deux fois plus court sur sol mouillé.' },
];
const AUTO = `<div class="caisse"><svg viewBox="0 0 260 124" aria-hidden="true"><defs><linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2D8A"/><stop offset="1" stop-color="#B14CFF"/></linearGradient></defs>
  <rect x="38" y="4" width="26" height="22" rx="5" fill="#1A0A33"/><rect x="38" y="98" width="26" height="22" rx="5" fill="#1A0A33"/><rect x="178" y="4" width="26" height="22" rx="5" fill="#1A0A33"/><rect x="178" y="98" width="26" height="22" rx="5" fill="#1A0A33"/>
  <rect x="14" y="14" width="232" height="96" rx="30" fill="url(#t)" stroke="#1A0A33" stroke-width="3"/>
  <path d="M86 22 L160 22 Q176 26 176 40 L176 84 Q176 98 160 102 L86 102 Q74 98 74 84 L74 40 Q74 26 86 22 Z" fill="#2A1A5E" stroke="#1A0A33" stroke-width="2.5"/>
  <rect x="90" y="30" width="60" height="64" rx="8" fill="#7FD9FF" opacity=".35"/>
  <rect x="228" y="30" width="12" height="18" rx="3" fill="#FFF3C4"/><rect x="228" y="76" width="12" height="18" rx="3" fill="#FFF3C4"/>
  <rect x="20" y="30" width="10" height="18" rx="3" fill="#B0263F"/><rect x="20" y="76" width="10" height="18" rx="3" fill="#B0263F"/>
  <g class="stop"><rect x="16" y="26" width="16" height="26" rx="4" fill="#FF2E4D"/><rect x="16" y="72" width="16" height="26" rx="4" fill="#FF2E4D"/><ellipse cx="6" cy="39" rx="12" ry="16" fill="#FF2E4D" opacity=".45"/><ellipse cx="6" cy="85" rx="12" ry="16" fill="#FF2E4D" opacity=".45"/></g></svg></div>`;
const liste = document.getElementById('liste'), piste = document.getElementById('piste'), fiche = document.getElementById('fiche'), vit = document.getElementById('vit'), etat = document.getElementById('etat');
document.getElementById('auto').innerHTML = AUTO;
let minuteries = [];
const plusTard = (fn, ms) => { const t = setTimeout(fn, ms); minuteries.push(t); return t; };
PANNES.forEach((p, i) => {
  const b = document.createElement('button'); b.className = 'panne'; b.innerHTML = `<b>${i + 1}</b><span>${p.nom}<small>${p.sous}</small></span>`;
  b.onclick = () => joue(p, b); liste.appendChild(b);
});
const DUREE_NORMALE = 1600, DUREE_PANNE = 3600;
function joue(p, b){
  // 1) remise à zéro complète : minuteries, classes, voiture neuve à sa place de départ
  minuteries.forEach(t => { clearTimeout(t); clearInterval(t); }); minuteries = [];
  document.querySelectorAll('.panne.on').forEach(x => x.classList.remove('on')); b.classList.add('on');
  piste.className = 'piste';
  const vieux = document.getElementById('auto'); const neuf = document.createElement('div'); neuf.className = 'auto'; neuf.id = 'auto'; neuf.innerHTML = AUTO; vieux.replaceWith(neuf);
  document.getElementById('attente').classList.add('off');
  document.getElementById('flaque').style.opacity = 0; document.getElementById('repere').style.opacity = 0;
  document.getElementById('nom').textContent = 'Rocade · ' + p.nom;
  fiche.classList.remove('on'); etat.className = 'etat'; etat.textContent = 'Conduite normale';
  vit.innerHTML = p.vit + '<small>km/h</small>';
  void piste.offsetWidth;
  // 2) quelques instants de conduite normale
  piste.classList.add('normal');
  if (p.id === 'glisse') document.getElementById('flaque').style.opacity = 1;
  if (p.freine) document.getElementById('repere').style.opacity = 1;
  // 3) la panne apparaît
  plusTard(() => {
    piste.classList.remove('normal'); void piste.offsetWidth; piste.classList.add('p-' + p.id);
    etat.textContent = p.alerte; etat.classList.add('alerte');
    fiche.innerHTML = `<div><div class="k">Ce que tu sens au volant</div><p>${p.volant}</p></div><div><div class="k">La cause, côté atelier</div><p>${p.cause}</p></div>`;
    fiche.classList.add('on'); b.classList.add('vue');
    if (p.freine) { let v = p.vit, t = 0; const iv = setInterval(() => { t += .1; if (t > 1.2) v = Math.max(0, v - p.freine); vit.innerHTML = Math.round(v) + '<small>km/h</small>'; if (v <= 0) clearInterval(iv); }, 100); minuteries.push(iv); }
  }, DUREE_NORMALE);
  // 4) fin : la route s'arrête
  plusTard(() => piste.classList.add('stop'), DUREE_NORMALE + DUREE_PANNE);
}
// Réglage et contrôle : ?panne=3 lance la troisième panne au chargement
const auto0 = new URLSearchParams(location.search).get('panne'); if (auto0) setTimeout(() => liste.children[auto0 - 1].click(), 300);
boutonVoix('pannes', 'left:626px;top:44px');
</script>
</body>
</html>
