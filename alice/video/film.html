<html lang="fr">

.dette .m{left:24px;bottom:18px;font:700 54px/1 var(--f-chiffre);color:var(--corail)}

.pil{height:46px;padding:0 18px;border-radius:23px;font:800 19px/46px var(--f-titre);color:#fff;white-space:nowrap}
.pil.min{background:var(--lilas)}.pil.plus{background:var(--corail)}
.boule{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#F1E9FD 55%,#C9B1F7 100%);box-shadow:0 10px 24px rgba(58,0,87,.2),0 0 0 4px #fff inset}
.qm{font:800 120px/1 var(--f-chiffre);color:var(--lilas-2)}
.note{left:70px;width:760px;font:400 22px/1.4 var(--f-texte);color:var(--gris)}
.note b{color:var(--violet)}
.col{width:500px;top:150px;bottom:150px;border-radius:26px;background:#fff;box-shadow:0 16px 36px rgba(58,0,87,.12)}
.col .tete{left:0;right:0;top:0;height:70px;border-radius:24px 24px 0 0;color:#fff;font:800 28px/70px var(--f-titre);text-align:center;letter-spacing:.04em}
.obj{width:150px;text-align:center}
.obj svg{display:block;width:124px;height:124px;margin:0 auto}
.obj b{display:block;font:700 20px/1.2 var(--f-texte);color:var(--violet);margin-top:6px}
.barre{bottom:26px;height:22px;border-radius:11px;left:40px;width:420px;transform-origin:left center}
.egal{left:590px;top:300px;width:100px;height:100px;border-radius:50%;background:var(--violet);color:#fff;font:700 62px/96px var(--f-chiffre);text-align:center}
.dixans{left:0;right:0;top:60px;text-align:center;font:800 54px/1 var(--f-titre);color:var(--corail)}
.cred{left:0;right:0;text-align:center;font:400 24px/1.4 var(--f-texte);color:var(--gris)}
.conf{width:16px;height:24px;border-radius:4px}
</style>
</head>
