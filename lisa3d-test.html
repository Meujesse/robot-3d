<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisa 3D : banc d’essai</title>
<script src="lisa-bouche.js?v=2"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #6fb3c3; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { display: grid; grid-template-rows: 1fr auto; height: 100%; }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background: rgba(0,0,0,.35); align-items: center; }
  .bar button { font: inherit; font-size: 12px; padding: 5px 9px; border: 0; border-radius: 6px; background: #fff; cursor: pointer; }
  .bar label { color: #fff; font-size: 12px; }
  #info { color: #fff; font-size: 12px; padding: 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="stage"></div>
  <div class="bar" id="bar">
    <label>Plan <select id="plan"><option>pied</option><option>americain</option><option selected>buste</option><option>gros</option></select></label>
    <label>Ouv. <input id="ouv" type="range" min="0" max="1" step="0.01" value="0"></label>
    <button id="blink">cligne</button>
    <label><input id="parle" type="checkbox"> parle (simulé)</label>
    <span id="info"></span>
  </div>
</div>
<script type="module">
  const { create } = await import('./lisa3d-rig.js?v=' + Date.now());
  const p = new URLSearchParams(location.search);
  const lisa = create({ stage: document.getElementById('stage'), onPose: (n, pl) => { document.getElementById('plan').value = pl; } });
  await lisa.init(p.get('glb') || 'lisa.glb');
  document.getElementById('info').textContent = 'animations : ' + lisa.animations().join(', ') + (lisa.hasHead() ? '' : ' (pas d’os de tête)');
  const bar = document.getElementById('bar');
  for (const n of lisa.animations()) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => lisa.play(n); bar.appendChild(b); }
  document.getElementById('plan').onchange = e => lisa.setPlan(e.target.value);
  const ouv = document.getElementById('ouv'); ouv.oninput = () => lisa._bouche(+ouv.value, 0, 0);
  document.getElementById('blink').onclick = () => lisa._clignote();
  document.getElementById('parle').onchange = e => {
    if (e.target.checked) {
      const start = performance.now();
      lisa.nourrit("Coucou, moi c'est Lisa ! En vrai j'suis là pour t'accompagner, du coup dis-moi, on commence par quoi ?");
      lisa.setAmpSource(() => { const k = (performance.now() - start) / 1000; return 0.35 + 0.35 * Math.abs(Math.sin(k * 9)) * (0.6 + 0.4 * Math.sin(k * 2.3)); });
      lisa.setState('speaking');
    } else { lisa.setState('idle'); lisa.setAmpSource(null); }
  };
  window.lisa = lisa;
  if (p.get('plan')) lisa.setPlan(p.get('plan'));
  if (p.get('ouv')) setTimeout(() => lisa._bouche(+p.get('ouv'), 0, 0), 500);
  if (p.get('anim')) setTimeout(() => lisa.play(p.get('anim')), 500);
</script>
</body>
</html>
